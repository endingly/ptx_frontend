name: Integration smoke

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: integration-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  test:
    name: GCC Debug installed consumer smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Linux dependencies
        id: setup
        uses: ./.github/actions/setup-linux
        with:
          writes-shared-caches: "true"

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/ccache
          key: ccache-v7-${{ runner.os }}-${{ runner.arch }}-ci-linux-gcc-debug-${{ steps.setup.outputs.compiler-identity }}-${{ steps.setup.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v7-${{ runner.os }}-${{ runner.arch }}-ci-linux-gcc-debug-${{ steps.setup.outputs.compiler-identity }}-${{ steps.setup.outputs.month }}-
            ccache-v7-${{ runner.os }}-${{ runner.arch }}-ci-linux-gcc-debug-${{ steps.setup.outputs.compiler-identity }}-

      - name: Configure
        shell: bash
        run: |
          ccache --zero-stats
          cmake --preset ci-integration-smoke -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Save vcpkg source-download cache
        if: success() && steps.setup.outputs.downloads-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/vcpkg/downloads
          key: ${{ steps.setup.outputs.downloads-cache-key }}

      - name: Save vcpkg binary archive cache
        if: success() && steps.setup.outputs.binary-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/vcpkg/archives
          key: ${{ steps.setup.outputs.binary-cache-key }}

      - name: Build resolved IR only
        run: cmake --build --preset ci-integration-smoke

      - name: Test installed package consumer smoke
        run: ctest --preset ci-integration-smoke --output-on-failure --no-tests=error

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
