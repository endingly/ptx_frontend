name: Linux CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    concurrency:
      group: linux-ci-${{ github.event.pull_request.number }}-${{ matrix.preset }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            preset: ci-linux-gcc-debug
          - name: Release
            preset: ci-linux-gcc-release

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Compute cache epoch
        id: cache-epoch
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore APT package cache
        uses: actions/cache@v6
        with:
          path: .cache/apt/archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-epoch.outputs.month }}-${{ hashFiles('.github/workflows/linux-ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-epoch.outputs.month }}-

      - name: Install system dependencies
        shell: bash
        env:
          APT_CACHE_DIR: ${{ github.workspace }}/.cache/apt/archives
        run: |
          mkdir -p "$APT_CACHE_DIR/partial"
          chmod 0777 "$APT_CACHE_DIR" "$APT_CACHE_DIR/partial"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$APT_CACHE_DIR" \
            -o Binary::apt::APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
            build-essential \
            ccache \
            clang-format \
            cmake \
            curl \
            flex \
            gcc \
            g++ \
            git \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            tar \
            unzip \
            zip
          sudo chmod -R a+rX "$APT_CACHE_DIR"

      - name: Install Python generator dependencies
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false
          doNotCache: false

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-

      - name: Run CMake workflow preset
        shell: bash
        run: cmake --workflow --preset "${{ matrix.preset }}"

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
