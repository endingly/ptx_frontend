name: Python and package consumer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-and-package-consumer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
      CCACHE_METRICS_DIR: ${{ runner.temp }}/ccache-metrics/ci-python-and-package-consumer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test CI helper scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Set up Linux dependencies
        id: setup
        uses: ./.github/actions/setup-linux

      - name: Check tracked handwritten C++ formatting
        run: python3 .github/scripts/check_clang_format.py --clang-format clang-format-21

      # Read-only consumer jobs restore a compatible Debug production seed but
      # never own or upload one; trusted main integration owns all seed writes.
      - name: Restore persistent compiler cache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/ccache
          key: ccache-v8-${{ runner.os }}-${{ runner.arch }}-ci-linux-gcc-debug-${{ steps.setup.outputs.compiler-identity }}-${{ github.sha }}
          restore-keys: |
            ccache-v8-${{ runner.os }}-${{ runner.arch }}-ci-linux-gcc-debug-${{ steps.setup.outputs.compiler-identity }}-

      - name: Configure and reset production compiler-cache statistics
        shell: bash
        run: |
          rm -rf "$CCACHE_METRICS_DIR"
          mkdir -p "$CCACHE_METRICS_DIR"
          ccache --zero-stats
          date +%s > "$CCACHE_METRICS_DIR/production.started-at"
          cmake --preset ci-linux-gcc-debug -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Build production target
        id: production-build
        shell: bash
        run: |
          date +%s > "$CCACHE_METRICS_DIR/production.build-started-at"
          set +e
          cmake --build --preset ci-python-and-package-consumer
          build_exit_code=$?
          date +%s > "$CCACHE_METRICS_DIR/production.finished-at"
          echo "$build_exit_code" > "$CCACHE_METRICS_DIR/production.build-exit-code"
          exit "$build_exit_code"

      - name: Record production compiler-cache statistics
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/capture_ccache_metrics.py \
            --phase production-build --started-at-file "$CCACHE_METRICS_DIR/production.started-at" \
            --finished-at-file "$CCACHE_METRICS_DIR/production.finished-at" \
            --build-started-at-file "$CCACHE_METRICS_DIR/production.build-started-at" \
            --build-finished-at-file "$CCACHE_METRICS_DIR/production.finished-at" \
            --build-exit-code-file "$CCACHE_METRICS_DIR/production.build-exit-code" \
            --status "${{ steps.production-build.outcome }}" \
            --output "$CCACHE_METRICS_DIR/production-build.json" || true
          ccache --show-stats || true

      # Python/package tests can launch installed-consumer builds. Their compiler
      # output belongs in RUNNER_TEMP, never in the restored production seed.
      - name: Reset disposable test compiler cache statistics
        if: success()
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-test/ci-python-and-package-consumer
        run: |
          rm -rf "$CCACHE_DIR"
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          date +%s > "$CCACHE_METRICS_DIR/tests.started-at"

      - name: Test Python and package consumer in disposable compiler cache
        id: consumer-test
        shell: bash
        if: success()
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-test/ci-python-and-package-consumer
        run: |
          set +e
          ctest --preset ci-python-and-package-consumer --output-on-failure
          test_exit_code=$?
          date +%s > "$CCACHE_METRICS_DIR/tests.finished-at"
          exit "$test_exit_code"

      - name: Record test compiler-cache statistics
        if: always()
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-test/ci-python-and-package-consumer
        run: |
          python3 .github/scripts/capture_ccache_metrics.py \
            --phase tests --started-at-file "$CCACHE_METRICS_DIR/tests.started-at" \
            --finished-at-file "$CCACHE_METRICS_DIR/tests.finished-at" \
            --status "${{ steps.consumer-test.outcome }}" \
            --output "$CCACHE_METRICS_DIR/tests.json" || true
          ccache --show-stats || true

      - name: Upload compiler-cache measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-ccache-metrics
          path: ${{ runner.temp }}/ccache-metrics/ci-python-and-package-consumer
          if-no-files-found: warn
          retention-days: 14
