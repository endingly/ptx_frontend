name: Python unit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-unit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite"
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python generator dependencies
        uses: ./.github/actions/setup-linux

      - name: Check tracked handwritten C++ formatting
        run: python3 .github/scripts/check_clang_format.py --clang-format clang-format-21

      - name: Run Python unit tests
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/python" \
            .venv/bin/python -m unittest_parallel \
              -s python/tests -t python -p 'test_*.py' --level=module -v
