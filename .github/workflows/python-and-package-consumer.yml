name: Python and package consumer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-and-package-consumer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test CI helper scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Set up Linux dependencies
        id: setup
        uses: ./.github/actions/setup-linux

      - name: Check tracked handwritten C++ formatting
        run: python3 .github/scripts/check_clang_format.py --clang-format clang-format-21

      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/ccache
          key: ccache-v7-${{ runner.os }}-${{ runner.arch }}-ci-linux-gcc-debug-${{ steps.setup.outputs.compiler-identity }}-${{ steps.setup.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v7-${{ runner.os }}-${{ runner.arch }}-ci-linux-gcc-debug-${{ steps.setup.outputs.compiler-identity }}-${{ steps.setup.outputs.month }}-
            ccache-v7-${{ runner.os }}-${{ runner.arch }}-ci-linux-gcc-debug-${{ steps.setup.outputs.compiler-identity }}-

      - name: Configure
        shell: bash
        run: |
          ccache --zero-stats
          cmake --preset ci-linux-gcc-debug -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Build
        run: cmake --build --preset ci-python-and-package-consumer

      - name: Test Python and package consumer
        run: ctest --preset ci-python-and-package-consumer --output-on-failure

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
