# yaml-language-server: $schema=schemas/opcode-coverage-v1.schema.yaml

# `partial` means the frontend has a deliberately limited YAML variant slice,
# not full PTX ISA coverage for that opcode.  There is no executor in ptxsim
# yet, so every simulator status remains `unsupported`.
schema: ptx-opcode-coverage/v1
version: 1
opcodes:
