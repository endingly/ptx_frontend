# PTX integer, floating-point, half-precision, and mixed-precision arithmetic.
# yaml-language-server: $schema=../schemas/ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: arithmetic
codegen_category: arithmetic
doc: "Merged PTX ISA 9.3 arithmetic categories 9.7.1 through 9.7.5."

type_sets:
  add_integer_scalar: [u16, u32, u64, s16, s32, s64]
  add_simd_no_sat: [u16x2, s16x2]
  add_packed_optional_sat: [u8x4, s8x4]
  add_late_sat: [u16x2, s16x2, u32]
  sub_integer_scalar: [u16, u32, u64, s16, s64]
  sub_optional_sat: [s32, u8x4, s8x4]

  add_half_types:
    - f16
    - f16x2

  add_bfloat_types:
    - bf16
    - bf16x2

value_sets:
  rounding_modes:
    - rn
    - rz
    - rm
    - rp

operand_patterns:
  binary_arith:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}

  unary_scalar_register:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}}
    - {name: src, kind: reg, role: src, access: read, type: {expr: "modifier(type)"}}

  unary_packed_b32_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: exact}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: exact}

  popc_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: exact}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: same_width}

  clz_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: exact}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: same_width}

  clz_b64:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: exact}
    - {name: src, kind: reg, role: src, access: read, type: b64, register_width: same_width}

  bfind_shiftamt_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: exact}
    - {name: src, kind: reg, role: src, access: read, type: u32, register_width: exact}

  bfe_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: exact}
    - {name: src, kind: reg, role: src1, access: read, type: u32, register_width: exact}
    - {name: offset, kind: imm, role: src2, access: read, type: u32}
    - {name: width, kind: imm, role: src3, access: read, type: u32}

  bfi_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: insert, kind: reg, role: src1, access: read, type: b32, register_width: same_width}
    - {name: base, kind: reg, role: src2, access: read, type: b32, register_width: same_width}
    - {name: offset, kind: imm, role: src3, access: read, type: u32}
    - {name: width, kind: imm, role: src3, access: read, type: u32}

  brev_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: same_width}

  binary_wide_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u64, register_width: exact}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: exact}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: exact}

  ternary_arith:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: {expr: "modifier(type)"}}

  ternary_wide_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u64, register_width: exact}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: exact}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: exact}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: u64, register_width: exact}

  binary_float_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)

    - name: src1
      kind: reg_or_imm
      role: src1
      access: read
      type:
        expr: modifier(type)

    - name: src2
      kind: reg_or_imm
      role: src2
      access: read
      type:
        expr: modifier(type)

  binary_float_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)

    - name: src1
      kind: reg
      role: src1
      access: read
      type:
        expr: modifier(type)

    - name: src2
      kind: reg
      role: src2
      access: read
      type:
        expr: modifier(type)

  binary_float_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: {expr: "modifier(type)"}, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: {expr: "modifier(type)"}, register_width: exact}

  ternary_float_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)

    - name: src1
      kind: reg
      role: src1
      access: read
      type:
        expr: modifier(type)

    - name: src2
      kind: reg
      role: src2
      access: read
      type:
        expr: modifier(type)

    - name: src3
      kind: reg
      role: src3
      access: read
      type:
        expr: modifier(type)

  ternary_float_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: {expr: "modifier(type)"}, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: {expr: "modifier(type)"}, register_width: exact}
    - {name: src3, kind: reg, role: src3, access: read, type: {expr: "modifier(type)"}, register_width: exact}

  binary_mixed_float_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(result_type)

    - name: src
      kind: reg
      role: src1
      access: read
      type:
        expr: modifier(input_type)

    - name: addend
      kind: reg
      role: src2
      access: read
      type:
        expr: modifier(result_type)

instructions:
  - opcode: add
    section: "9.7.3.3"
    doc: "Standard floating-point add."
    syntax: >-
      add{.rnd}{.ftz}{.sat}.f32 | add{.rnd}{.ftz}.f32x2 |
      add{.rnd}.f64 dst, src1, src2
    operands: $binary_float_scalar

    variants:
      - name: add_float_f32
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn
              - rz
              - value: rm
                availability:
                  ptx: "1.0"
                  sm: 20
              - value: rp
                availability:
                  ptx: "1.0"
                  sm: 20

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
        rule: floating_point.add

        examples:
          - ptx: "add.f32 d, a, b;"
            valid: true
          - ptx: "add.rz.ftz.sat.f32 d, a, b;"
            valid: true

      - name: add_float_f32x2
        operands: $binary_float_register
        availability:
          ptx: "8.6"
          sm: 100
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32x2
        rule: floating_point.add

        examples:
          - ptx: "add.f32x2 d, a, b;"
            valid: true
          - ptx: "add.rp.ftz.f32x2 d, a, b;"
            valid: true

      - name: add_float_f64
        availability:
          ptx: "1.0"
          sm: 13
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f64
        rule: floating_point.add

        examples:
          - ptx: "add.f64 d, a, b;"
            valid: true
          - ptx: "add.rm.f64 d, a, b;"
            valid: true

  - opcode: add
    section: "9.7.4.1"
    doc: "Half-precision and bfloat add."
    syntax: "add{.rn}{.ftz}{.sat}.{f16|f16x2|bf16|bf16x2} dst, src1, src2"
    variants:
      - name: add_half
        operands: $binary_float_register
        availability:
          ptx: "4.2"
          sm: 53
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $add_half_types
        rule: floating_point.add_half

        examples:
          - ptx: "add.f16 d, a, b;"
            valid: true
          - ptx: "add.rn.ftz.sat.f16x2 d, a, b;"
            valid: true

      - name: add_bfloat
        operands: $binary_float_register
        availability:
          ptx: "7.8"
          sm: 90
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $add_bfloat_types
        rule: floating_point.add_bfloat

        examples:
          - ptx: "add.bf16 d, a, b;"
            valid: true
          - ptx: "add.rn.bf16x2 d, a, b;"
            valid: true

  - opcode: add
    section: "9.7.5.1"
    doc: "Mixed-precision add."
    syntax: "add{.rnd}{.sat}.f32.{f16|bf16} dst, src, addend"
    variants:
      - name: add_mixed_f32
        operands: $binary_mixed_float_register
        availability:
          ptx: "8.6"
          sm: 100
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32

          - name: input_type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - f16
              - bf16

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat
        rule: mixed_precision.add

        examples:
          - ptx: "add.f32.f16 d, a, c;"
            valid: true
          - ptx: "add.rz.f32.bf16.sat d, a, c;"
            valid: true

  - opcode: sub
    section: "9.7.3.4"
    doc: "Standard floating-point subtract."
    syntax: >-
      sub{.rnd}{.ftz}{.sat}.f32 | sub{.rnd}{.ftz}.f32x2 |
      sub{.rnd}.f64 dst, src1, src2
    operands: $binary_float_scalar

    variants:
      - name: sub_float_f32
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn
              - rz
              - value: rm
                availability:
                  ptx: "1.0"
                  sm: 20
              - value: rp
                availability:
                  ptx: "1.0"
                  sm: 20

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
        rule: floating_point.sub

        examples:
          - ptx: "sub.f32 d, a, b;"
            valid: true
          - ptx: "sub.rz.ftz.sat.f32 d, a, b;"
            valid: true

      - name: sub_float_f32x2
        operands: $binary_float_register
        availability:
          ptx: "8.6"
          sm: 100
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32x2
        rule: floating_point.sub

        examples:
          - ptx: "sub.f32x2 d, a, b;"
            valid: true
          - ptx: "sub.rp.ftz.f32x2 d, a, b;"
            valid: true

      - name: sub_float_f64
        availability:
          ptx: "1.0"
          sm: 13
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f64
        rule: floating_point.sub

        examples:
          - ptx: "sub.f64 d, a, b;"
            valid: true
          - ptx: "sub.rm.f64 d, a, b;"
            valid: true

  - opcode: sub
    section: "9.7.4.2"
    doc: "Half-precision and bfloat subtract."
    syntax: "sub{.rn}{.ftz}{.sat}.{f16|f16x2|bf16|bf16x2} dst, src1, src2"
    variants:
      - name: sub_half
        operands: $binary_float_register
        availability:
          ptx: "4.2"
          sm: 53
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $add_half_types
        rule: floating_point.sub_half

        examples:
          - ptx: "sub.f16 d, a, b;"
            valid: true
          - ptx: "sub.rn.ftz.sat.f16x2 d, a, b;"
            valid: true

      - name: sub_bfloat
        operands: $binary_float_register
        availability:
          ptx: "7.8"
          sm: 90
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $add_bfloat_types
        rule: floating_point.sub_bfloat

        examples:
          - ptx: "sub.bf16 d, a, b;"
            valid: true
          - ptx: "sub.rn.bf16x2 d, a, b;"
            valid: true

  - opcode: sub
    section: "9.7.5.2"
    doc: "Mixed-precision subtract."
    syntax: "sub{.rnd}{.sat}.f32.{f16|bf16} dst, src, subtrahend"
    variants:
      - name: sub_mixed_f32
        operands:
          - name: dst
            kind: reg
            role: dst
            access: write
            type:
              expr: modifier(result_type)

          - name: src
            kind: reg
            role: src1
            access: read
            type:
              expr: modifier(input_type)

          - name: subtrahend
            kind: reg
            role: src2
            access: read
            type:
              expr: modifier(result_type)
        availability:
          ptx: "8.6"
          sm: 100
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32

          - name: input_type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - f16
              - bf16

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat
        rule: mixed_precision.sub

        examples:
          - ptx: "sub.f32.f16 d, a, c;"
            valid: true
          - ptx: "sub.rz.f32.bf16.sat d, a, c;"
            valid: true

  - opcode: mul
    section: "9.7.3.5"
    doc: "Frozen round-to-nearest single-precision multiply."
    syntax: "mul.rn.f32 dst, src1, src2"
    operands: $binary_float_register
    variants:
      - name: mul_rn_f32
        description: "Register-only round-to-nearest single-precision multiply."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rn
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
        examples:
          - ptx: "mul.rn.f32 %f0, %f1, %f2;"
            valid: true

  - opcode: fma
    section: "9.7.3.6"
    doc: "Frozen round-to-nearest single- and double-precision fused multiply-add."
    syntax: "fma.rn.f32 | fma.rn.f64 dst, src1, src2, src3"
    operands: $ternary_float_register
    variants:
      - name: fma_rn_f32
        description: "Register-only round-to-nearest single-precision fused multiply-add."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rn
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
        examples:
          - ptx: "fma.rn.f32 %f0, %f1, %f2, %f3;"
            valid: true

      - name: fma_rn_f64
        operands: $ternary_float_register_exact
        availability: {ptx: "1.4", sm: 13}
        modifiers:
          - {name: rounding, kind: rounding, domain: rounding_modes, presence: fixed, value: rn}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f64}
        examples:
          - {ptx: "fma.rn.f64 %d0, %d1, %d2, %d3;", valid: true}

  - opcode: fma
    section: "9.7.4.4"
    doc: "Frozen round-to-nearest half-precision fused multiply-add."
    syntax: "fma.rn.f16 dst, src1, src2, src3"
    operands: $ternary_float_register_exact
    variants:
      - name: fma_rn_f16
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: rounding, kind: rounding, domain: rounding_modes, presence: fixed, value: rn}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f16}
        examples:
          - {ptx: "fma.rn.f16 %h0, %h1, %h2, %h3;", valid: true}

  - opcode: mad
    section: "9.7.3.7"
    doc: "Frozen round-to-nearest single-precision multiply-add."
    syntax: "mad.rn.f32 dst, src1, src2, src3"
    operands: $ternary_float_register_exact
    variants:
      - name: mad_rn_f32
        availability: {ptx: "2.0", sm: 20}
        modifiers:
          - {name: rounding, kind: rounding, domain: rounding_modes, presence: fixed, value: rn}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f32}
        examples:
          - {ptx: "mad.rn.f32 %f0, %f1, %f2, %f3;", valid: true}

  - opcode: div
    section: "9.7.3.8"
    doc: "Frozen round-to-nearest single- and double-precision division."
    syntax: "div.rn.f32 | div.rn.f64 dst, src1, src2"
    operands: $binary_float_register_exact
    variants:
      - name: div_rn_f32
        availability: {ptx: "1.4", sm: 20}
        modifiers:
          - {name: rounding, kind: rounding, domain: rounding_modes, presence: fixed, value: rn}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f32}
        examples:
          - {ptx: "div.rn.f32 %f0, %f1, %f2;", valid: true}

      - name: div_rn_f64
        availability: {ptx: "1.4", sm: 13}
        modifiers:
          - {name: rounding, kind: rounding, domain: rounding_modes, presence: fixed, value: rn}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f64}
        examples:
          - {ptx: "div.rn.f64 %d0, %d1, %d2;", valid: true}

  - opcode: add
    section: "9.7.1.1"
    doc: "Integer add."
    syntax: "add{.sat}.{type} dst, src1, src2"
    operands: $binary_arith
    variants:
      - name: add_integer_no_sat
        availability: {ptx: "1.0", sm: 0}
        modifiers:
