# PTX data-movement instructions.
# yaml-language-server: $schema=../schemas/ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: data_movement_and_conversion
codegen_category: data_movement
section: "9.7.9"

type_sets:
  ld_st_scalar_types:
    - b8
    - b16
    - b32
    - b64
    - u8
    - u16
    - u32
    - u64
    - s8
    - s16
    - s32
    - s64
    - f32

value_sets:
  ld_cache_operators: [ca, cg, cs, lu, cv]
  st_cache_operators: [wb, cg, cs, wt]

operand_patterns:
  mov_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: mov_scalar_src
      role: src
      access: read
      type:
        expr: modifier(type)

  mov_pred:
    - name: dst
      kind: pred
      role: dst
      access: write
      type: pred
    - name: src
      kind: pred
      role: src
      access: read
      type: pred

  cvt_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(dst_type)
      register_width: equal_or_wider
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(src_type)
      register_width: equal_or_wider

  cvta_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)

  mov_pack:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity: [2, 4]

  mov_unpack:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity: [2, 4]
        allow_sink: true
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
  ld_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        - value: const
          availability:
            ptx: "3.1"
        - global
        - local
        - shared

  ld_explicit_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: input
        function_availability:
          ptx: "2.0"
          sm: 20

  ld_explicit_scalar_cache_policy:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  ld_explicit_scalar_global:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)

  prefetch_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)

  cp_async_shared_global:
    - name: dst
      kind: addr
      role: addr
      access: write
      state_space: [shared]
    - name: src
      kind: addr
      role: addr
      access: read
      state_space: [global]
    - name: cp_size
      kind: imm
      role: src
      access: read
      type: u32

  ldmatrix_m8n8_x2_shared_b16:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type: b32
      vector:
        kind: matrix_fragment
        arity: [2]
        type_policy: element
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [shared]

  ld_vector:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        - value: const
          availability:
            ptx: "3.1"
        - global
        - local
        - shared

  ld_explicit_vector:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: input
        function_availability:
          ptx: "2.0"
          sm: 20

  st_scalar:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [global, local, shared]
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider

  st_vector:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [global, local, shared]
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true

  st_explicit_vector:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: return
        function_availability:
          ptx: "2.0"
          sm: 20
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true

  st_explicit_scalar:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: return
        function_availability:
          ptx: "2.0"
          sm: 20
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider

  st_explicit_scalar_cache_policy:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  st_explicit_scalar_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider

instructions:
  - opcode: cvta
    section: "9.7.9.21"
    doc: "Convert register-only global and generic u64 addresses."
    syntax: "cvta.global.u64 dst, src | cvta.to.global.u64 dst, src"
    operands: $cvta_register
    variants:
      - name: cvta_global_u64
        description: "Register-only global-to-generic u64 address conversion."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: to
            kind: flag
            presence: absent
            token: ".to"
          - name: state_space
            kind: state_space
            domain: memory_state_spaces
            presence: fixed
            value: global
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u64
        examples:
          - ptx: "cvta.global.u64 %rd0, %rd1;"
            valid: true
      - name: cvta_to_global_u64
        description: "Register-only generic-to-global u64 address conversion."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: to
            kind: flag
            presence: fixed
            value: true
            token: ".to"
          - name: state_space
            kind: state_space
            domain: memory_state_spaces
            presence: fixed
            value: global
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u64
        examples:
          - ptx: "cvta.to.global.u64 %rd0, %rd1;"
            valid: true

  - opcode: cvt
    section: "9.7.9.22"
    doc: "Convert frozen register-only .u32→.s32/.f32, .f64→.f32, or .f32→.u32 pairs."
    syntax: "cvt.s32.u32 dst, src | cvt.rn.f32.f64 dst, src | cvt.rn.f32.u32 dst, src | cvt.rzi.u32.f32 dst, src"
    operands: $cvt_scalar
    variants:
      - name: cvt_s32_u32
        description: "Register-only unsigned 32-bit to signed 32-bit conversion."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: s32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        examples:
          - ptx: "cvt.s32.u32 %s0, %r0;"
            valid: true
      - name: cvt_rn_f32_f64
        description: "Register-only round-to-nearest f64 to f32 conversion."
        availability:
          ptx: "1.0"
          sm: 13
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rn
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f64
        examples:
          - ptx: "cvt.rn.f32.f64 %f0, %fd0;"
            valid: true
      - name: cvt_rn_f32_u32
        description: "Register-only round-to-nearest u32 to f32 conversion."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rn
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        examples:
          - ptx: "cvt.rn.f32.u32 %f0, %r0;"
            valid: true
      - name: cvt_rzi_u32_f32
        description: "Register-only round-toward-zero f32 to u32 conversion."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rzi
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
        examples:
          - ptx: "cvt.rzi.u32.f32 %r0, %f0;"
            valid: true

  - opcode: mov
    section: "9.7.9.3"
    doc: >
      Move a scalar register, immediate, or compatible special register into
      a 16/32/64-bit register. Integer/bit-size 32/64-bit forms also accept a data-variable
      or formal-parameter address, with an optional constant byte offset, or a
      bare device/kernel function address. Predicate register moves are also
      supported. Bit-size forms pack or unpack two/four scalar register elements;
      .b128 is available only for these vector forms.
    syntax: "mov.{pred|b16|u16|s16|b32|u32|s32|f32|b64|u64|s64|f64|b128} dst, src"

    variants:
      - name: mov_scalar
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - b16
              - u16
              - s16
              - b32
              - u32
              - s32
              - f32
              - b64
              - u64
              - s64
              - value: b128
                availability:
                  ptx: "8.3"
                  sm: 70
              - value: f64
                availability:
                  ptx: "1.0"
                  sm: 13
        operand_layouts:
          - name: scalar
            operands: $mov_scalar
          - name: pack
            operands: $mov_pack
          - name: unpack
            operands: $mov_unpack
        rule: data_movement.mov
        operand_type_compatibilities:
          - operand: src
            value_kind: special_register
            values:
              - tid
              - ntid
              - ctaid
              - nctaid
            instruction_width: 16
            effective_type: u16
            availability:
              ptx: "1.0"
              sm: 0
          - operand: src
            value_kind: special_register
            values:
              - gridid
            instruction_width: 16
            effective_type: u16
            availability:
              ptx: "1.0"
              sm: 0
          - operand: src
            value_kind: special_register
            values:
              - gridid
            instruction_width: 32
            effective_type: u32
            availability:
              ptx: "1.3"
              sm: 0

        examples:
          - ptx: "mov.u16 %h0, %h1;"
            valid: true
          - ptx: "mov.u16 %h0, %tid.x;"
            valid: true
          - ptx: "mov.u32 %r0, %laneid;"
            valid: true
          - ptx: "mov.u32 %r0, %tid.x;"
            valid: true
          - ptx: "mov.u32 %r0, %r1;"
            valid: true
          - ptx: "mov.u32 %r0, 42;"
            valid: true
          - ptx: "mov.u32 %r0, kernel_parameter;"
            valid: true
          - ptx: "mov.u32 %r0, device_function;"
            valid: true
          - ptx: "mov.b32 %r0, %laneid;"
            valid: true
          - ptx: "mov.f32 %f0, 0f3f800000;"
            valid: true
          - ptx: "mov.u64 %rd0, global_value;"
            valid: true
          - ptx: "mov.u64 %rd0, global_value+8;"
            valid: true
          - ptx: "mov.u64 %rd0, %rd1;"
            valid: true
          - ptx: "mov.u64 %rd0, 0;"
            valid: true
          - ptx: "mov.u64 %rd0, kernel_function;"
            valid: true
          - ptx: "mov.f64 %fd0, 0d3ff0000000000000;"
            valid: true
          - ptx: "mov.b32 %r0, {%h0, %h1};"
            valid: true
          - ptx: "mov.b64 {%r0, _}, %rd0;"
            valid: true
          - ptx: "mov.b128 %b0, {%rd0, %rd1};"
            valid: true

      - name: mov_pred
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operands: $mov_pred
        rule: data_movement.mov

        examples:
          - ptx: "mov.pred %p0, %p1;"
            valid: true

  - opcode: ld
    section: "9.7.9.8"
    doc: >
      Scalar and legacy v2/v4 forms, plus PTX 8.8 256-bit v8 32-bit and v4
      64-bit vector loads through a generic address or explicit global space.
      Alignment and other qualifiers remain separate coverage.
    syntax: "ld{.const|.global|.local|.param|.param::entry|.param::func|.shared}{.v2|.v4|.v8}.{b8|b16|b32|b64|u8|u16|u32|u64|s8|s16|s32|s64|f32|f64} dst, [address]"

    variants:
      - name: ld_generic_scalar
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - &ld_semantics
            name: semantics
            kind: semantics
            domain: memory_consistencies
            presence: optional
            values:
              - value: weak
                availability: {ptx: "6.0", sm: 70}
              - value: volatile
                availability: {ptx: "1.1"}
              - value: relaxed
                availability: {ptx: "6.0", sm: 70}
              - value: acquire
                availability: {ptx: "6.0", sm: 70}
            default: omitted
          - &memory_scope
            name: scope
            kind: scope
            domain: memory_scopes
            presence: optional
            values:
              - value: cta
                availability: {ptx: "6.0", sm: 70}
              - value: cluster
                availability: {ptx: "7.8", sm: 90}
              - value: gpu
                availability: {ptx: "6.0", sm: 70}
              - value: sys
                availability: {ptx: "6.0", sm: 70}
            default: none
          - &memory_mmio
            name: mmio
            kind: flag
            presence: optional
            values:
              - value: true
                token: .mmio
                availability: {ptx: "8.2", sm: 70}
            default: false
          - name: cache
            kind: cache
            domain: cache_operators
            presence: optional
            values:
              - value: $ld_cache_operators
                availability: {ptx: "2.0", sm: 20}
            default: unspecified
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $ld_st_scalar_types
              - f64
        operands: $ld_scalar
        rule: data_movement.ld_generic
        constraints:
          - kind: memory_consistency
            semantics_modifier: semantics
            scope_modifier: scope
            mmio_modifier: mmio
            cache_modifier: cache
            address_operand: address
          - kind: address_alignment
            address_operand: address
            type_modifier: type

        examples:
          - ptx: "ld.u32 %r0, [%rd0+4];"
            valid: true
          - ptx: "ld.u32 %r0, [global_value];"
            valid: true

      - name: ld_explicit_scalar
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: state_space
            kind: state_space
            domain: state_spaces
            presence: required
            values: [const, global, local, param, param::entry, param::func, shared]
          - name: cache
            kind: cache
            domain: cache_operators
            presence: optional
            values:
              - value: $ld_cache_operators
                availability: {ptx: "2.0", sm: 20}
            default: unspecified
          - *ld_semantics
          - *memory_scope
          - *memory_mmio
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $ld_st_scalar_types
              - value: f64
                availability:
                  ptx: "1.0"
                  sm: 13
        operands: $ld_explicit_scalar
        rule: data_movement.ld_explicit
        constraints:
          - kind: memory_consistency
            semantics_modifier: semantics
            scope_modifier: scope
            mmio_modifier: mmio
            cache_modifier: cache
            address_operand: address
            state_space_modifier: state_space
          - kind: address_alignment
            address_operand: address
            type_modifier: type

        examples:
          - ptx: "ld.global.u32 %r0, [global_value];"
            valid: true
          - ptx: "ld.shared.u32 %r0, [shared_value];"
            valid: true

      - name: ld_global_u32_l1_evict
        availability: {ptx: "7.4", sm: 70}
        modifiers:
          - name: state_space
            kind: state_space
            domain: state_spaces
            presence: fixed
            value: global
          - name: eviction_priority
            kind: eviction_priority
            domain: eviction_priorities
            presence: required
            values:
              - value: evict_first
                token: .L1::evict_first
              - value: evict_last
                token: .L1::evict_last
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operands: $ld_explicit_scalar_global
        rule: data_movement.ld_explicit
        constraints:
          - kind: address_alignment
            address_operand: address
            type_modifier: type

        examples:
          - ptx: "ld.global.L1::evict_first.u32 %r0, [global_value];"
            valid: true
          - ptx: "ld.global.L1::evict_last.u32 %r0, [global_value];"
            valid: true

      - name: ld_global_u32_l2_cache_hint
        availability: {ptx: "7.4", sm: 80}
        modifiers:
          - name: state_space
            kind: state_space
            domain: state_spaces
            presence: fixed
            value: global
          - name: cache_hint
            kind: flag
            presence: fixed
            value: true
            token: .L2::cache_hint
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operands: $ld_explicit_scalar_cache_policy
        rule: data_movement.ld_explicit
        constraints:
          - kind: address_alignment
            address_operand: address
            type_modifier: type

        examples:
          - ptx: "ld.global.L2::cache_hint.u32 %r0, [global_value], %rd0;"
            valid: true

      - name: ld_generic_vector
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - *ld_semantics
          - *memory_scope
          - name: cache
            kind: cache
            domain: cache_operators
            presence: optional
            values:
              - value: $ld_cache_operators
                availability: {ptx: "2.0", sm: 20}
            default: unspecified
          - name: vector
            kind: vector
            domain: vector_arities
            presence: required
            values:
              - v2
              - v4
              - v8
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $ld_st_scalar_types
              - f64
        operands: $ld_vector
        rule: data_movement.ld_generic
        constraints:
          - kind: memory_consistency
            semantics_modifier: semantics
            scope_modifier: scope
            cache_modifier: cache
            address_operand: address
          - kind: address_alignment
            address_operand: address
            type_modifier: type
            vector_modifier: vector
          - kind: memory_vector
            type_modifier: type
            vector_operand: dst
            address_operand: address
            availability: {ptx: "8.8", sm: 100}

        examples:
          - ptx: "ld.v2.u32 {%r0, %r1}, [%rd0];"
            valid: true
          - ptx: "ld.v4.u16 {%h0, %h1, %h2, %h3}, [%rd0];"
            valid: true
          - ptx: "ld.v8.u32 {%r0, %r1, %r2, %r3, %r4, %r5, %r6, %r7}, [%rd0];"
            valid: true

      - name: ld_explicit_vector
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: state_space
            kind: state_space
            domain: state_spaces
            presence: required
            values: [const, global, local, param, param::entry, param::func, shared]
          - name: cache
