# PTX data-movement instructions.
# yaml-language-server: $schema=../schemas/ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.2"
category: data_movement_and_conversion
codegen_category: data_movement
section: "9.7.9"

operand_patterns:
  mov_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: mov_scalar_src
      role: src
      access: read
      type:
        expr: modifier(type)

  mov_pred:
    - name: dst
      kind: pred
      role: dst
      access: write
      type: pred
    - name: src
      kind: pred
      role: src
      access: read
      type: pred

  ld_u32_address:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
    - name: address
      kind: addr
      role: addr
      access: read

instructions:
  - opcode: mov
    section: "9.7.9.3"
    doc: >
      Move a scalar register, immediate, or compatible special register into
      a 32/64-bit register. Integer/bit-size forms also accept a data-variable
      or formal-parameter address, with an optional constant byte offset, or a
      bare device/kernel function address. Predicate register moves are also
      supported; vector and other-width forms remain separate coverage.
    syntax: "mov.{pred|b32|u32|s32|f32|b64|u64|s64|f64} dst, src"

    variants:
      - name: mov_scalar
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - b32
              - u32
              - s32
              - f32
              - b64
              - u64
              - s64
              - value: f64
                availability:
                  ptx: "1.0"
                  sm: 13
        operands: $mov_scalar
        rule: data_movement.mov

        examples:
          - ptx: "mov.u32 %r0, %laneid;"
            valid: true
          - ptx: "mov.u32 %r0, %tid.x;"
            valid: true
          - ptx: "mov.u32 %r0, %r1;"
            valid: true
          - ptx: "mov.u32 %r0, 42;"
            valid: true
          - ptx: "mov.u32 %r0, kernel_parameter;"
            valid: true
          - ptx: "mov.u32 %r0, device_function;"
            valid: true
          - ptx: "mov.b32 %r0, %laneid;"
            valid: true
          - ptx: "mov.f32 %f0, 0f3f800000;"
            valid: true
          - ptx: "mov.u64 %rd0, global_value;"
            valid: true
          - ptx: "mov.u64 %rd0, global_value+8;"
            valid: true
          - ptx: "mov.u64 %rd0, %rd1;"
            valid: true
          - ptx: "mov.u64 %rd0, 0;"
            valid: true
          - ptx: "mov.u64 %rd0, kernel_function;"
            valid: true
          - ptx: "mov.f64 %fd0, 0d3ff0000000000000;"
            valid: true

      - name: mov_pred
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operands: $mov_pred
        rule: data_movement.mov

        examples:
          - ptx: "mov.pred %p0, %p1;"
            valid: true

  - opcode: ld
    section: "9.7.9.8"
    doc: >
      Scalar u32 load through a generic address. Explicit state spaces,
      cache/consistency qualifiers, vectors, and other data widths remain
      separate coverage.
    syntax: "ld.u32 dst, [address]"

    variants:
      - name: ld_generic_u32
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operands: $ld_u32_address
        rule: data_movement.ld_generic

        examples:
          - ptx: "ld.u32 %r0, [%rd0+4];"
            valid: true
          - ptx: "ld.u32 %r0, [global_value];"
            valid: true
