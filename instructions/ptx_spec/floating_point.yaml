    syntax: >-
      sub{.rnd}{.ftz}{.sat}.f32 | sub{.rnd}{.ftz}.f32x2 |
      sub{.rnd}.f64 | sub{.rn}{.ftz}{.sat}.{f16|f16x2} |
      sub{.rn}.{bf16|bf16x2} dst, src1, src2 |
      sub{.rnd}{.sat}.f32.{f16|bf16} dst, src, subtrahend
    operands: $binary_float_scalar

    variants:
      - name: sub_float_f32
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn
              - rz
              - value: rm
                availability:
                  ptx: "1.0"
                  sm: 20
              - value: rp
                availability:
                  ptx: "1.0"
                  sm: 20

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat

          - name: type
