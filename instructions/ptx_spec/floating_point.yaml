        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32x2
        rule: floating_point.sub

        examples:
          - ptx: "sub.f32x2 d, a, b;"
            valid: true
          - ptx: "sub.rp.ftz.f32x2 d, a, b;"
            valid: true

      - name: sub_float_f64
        availability:
          ptx: "1.0"
          sm: 13
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f64
        rule: floating_point.sub

        examples:
          - ptx: "sub.f64 d, a, b;"
            valid: true
          - ptx: "sub.rm.f64 d, a, b;"
            valid: true

      - name: sub_half
        operands: $binary_float_register
        availability:
          ptx: "4.2"
          sm: 53
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $add_half_types
        rule: floating_point.sub_half

        examples:
          - ptx: "sub.f16 d, a, b;"
            valid: true
          - ptx: "sub.rn.ftz.sat.f16x2 d, a, b;"
            valid: true

      - name: sub_bfloat
        operands: $binary_float_register
        availability:
          ptx: "7.8"
          sm: 90
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $add_bfloat_types
        rule: floating_point.sub_bfloat

        examples:
          - ptx: "sub.bf16 d, a, b;"
