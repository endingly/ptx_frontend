# instructions/integer_arith.yaml
# yaml-language-server: $schema=../schemas/ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.2"
category: integer_arithmetic
codegen_category: arithmetic
section: "9.7.1"

type_sets:
  add_integer_scalar:
    - u16
    - u32
    - u64
    - s16
    - s32
    - s64

  add_simd_no_sat:
    - u16x2
    - s16x2

  add_packed_optional_sat:
    - u8x4
    - s8x4

  add_late_sat:
    - u16x2
    - s16x2
    - u32

operand_patterns:
  binary_arith:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)

    - name: src1
      kind: reg_or_imm
      role: src1
      access: read
      type:
        expr: modifier(type)

    - name: src2
      kind: reg_or_imm
      role: src2
      access: read
      type:
        expr: modifier(type)

instructions:
  - opcode: add
    section: "9.7.1.1"
    doc: "Integer add."
    syntax: "add{.sat}.{type} dst, src1, src2"
    operands: $binary_arith

    variants:
      - name: add_integer_no_sat
        description: "add integer no-sat scalar and SIMD forms."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $add_integer_scalar
              - value: $add_simd_no_sat
                availability:
                  ptx: "8.0"
                  sm: 90
        rule: integer_arith.add

        examples:
          - ptx: "add.u32 r1, r2, r3;"
            valid: true
          - ptx: "add.s32 r1, r2, 1;"
            valid: true
          - ptx: "add.u16x2 r1, r2, r3;"
            valid: true
          - ptx: "add.s16x2 r1, r2, r3;"
            valid: true

      - name: add_sat
        description: "add.sat with scalar and packed integer types."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: sat
            kind: flag
            presence: fixed
            value: true
            token: ".sat"

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - s32
              - value: $add_late_sat
                availability:
                  ptx: "9.2"
                  sm: 120
                  family: sm_120f
        rule: integer_arith.add_sat

        examples:
          - ptx: "add.sat.s32 r1, r2, r3;"
            valid: true
          - ptx: "add.sat.u16x2 r1, r2, r3;"
            valid: true
          - ptx: "add.sat.s16x2 r1, r2, r3;"
            valid: true
          - ptx: "add.sat.u32 r1, r2, r3;"
            valid: true

      - name: add_packed_optional_sat
        description: "add{.sat}.u8x4 / add{.sat}.s8x4 packed integer form."
        availability:
          ptx: "9.2"
          sm: 120
          family: sm_120f
        modifiers:
          - name: sat
            kind: flag
            presence: optional
            default: false
            token: ".sat"

          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $add_packed_optional_sat
        rule: integer_arith.add_packed

        examples:
          - ptx: "add.u8x4 r1, r2, r3;"
            valid: true
          - ptx: "add.sat.u8x4 r1, r2, r3;"
            valid: true
          - ptx: "add.s8x4 r1, r2, r3;"
            valid: true
          - ptx: "add.sat.s8x4 r1, r2, r3;"
            valid: true
