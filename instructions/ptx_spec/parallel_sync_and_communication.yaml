# PTX parallel synchronization and communication instructions.
# yaml-language-server: $schema=../schemas/ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.2"
category: parallel_synchronization_and_communication
codegen_category: parallel_synchronization_and_communication
section: "9.7.12"

operand_patterns:
  bar_sync_immediate_barrier:
    - name: barrier
      kind: imm
      role: barrier
      access: read
      type: u32

  bar_sync_barrier:
    - name: barrier
      kind: reg_or_imm
      role: barrier
      access: read
      type: u32
  bar_sync_barrier_and_thread_count:
    - name: barrier
      kind: reg_or_imm
      role: barrier
      access: read
      type: u32
    - name: thread_count
      kind: reg_or_imm
      role: thread_count
      access: read
      type: u32
  bar_red_popc_without_thread_count:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
    - name: barrier
      kind: reg_or_imm
      role: barrier
      access: read
      type: u32
    - name: predicate
      kind: pred_or_not
      role: predicate
      access: read
      type: pred
  bar_red_popc_with_thread_count:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
    - name: barrier
      kind: reg_or_imm
      role: barrier
      access: read
      type: u32
    - name: thread_count
      kind: reg_or_imm
      role: thread_count
      access: read
      type: u32
    - name: predicate
      kind: pred_or_not
      role: predicate
      access: read
      type: pred
  bar_red_pred_without_thread_count:
    - name: dst
      kind: pred
      role: predicate
      access: write
      type: pred
    - name: barrier
      kind: reg_or_imm
      role: barrier
      access: read
      type: u32
    - name: predicate
      kind: pred_or_not
      role: predicate
      access: read
      type: pred
  bar_red_pred_with_thread_count:
    - name: dst
      kind: pred
      role: predicate
      access: write
      type: pred
    - name: barrier
      kind: reg_or_imm
      role: barrier
      access: read
      type: u32
    - name: thread_count
      kind: reg_or_imm
      role: thread_count
      access: read
      type: u32
    - name: predicate
      kind: pred_or_not
      role: predicate
      access: read
      type: pred
  atom_global_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
  red_global_scalar:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
  vote_sync_ballot:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: b32
      register_width: exact
    - name: predicate
      kind: pred
      role: predicate
      access: read
      type: pred
    - name: membermask
      kind: reg_or_imm
      role: src
      access: read
      type: u32

instructions:
  - opcode: bar
    section: "9.7.12.1"
    doc: >
      CTA barrier synchronization. The barrier identifier and optional
      participating-thread count are unsigned 32-bit values.
    syntax: "bar{.cta}.{sync|arrive|red.*} operands"

    variants:
      # The register-barrier and thread-count forms were introduced together
      # in PTX ISA 2.0 and require sm_20. The older sm_1x form accepts only an
      # immediate barrier identifier.
      - name: bar_sync
        description: "bar.sync with a CTA barrier identifier and optional thread count."
        availability:
          ptx: "1.0"
          sm: 10
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: sync
            kind: flag
            presence: fixed
            value: true
            token: ".sync"
        operand_layouts:
          - name: immediate_barrier
            operands: $bar_sync_immediate_barrier
          - name: barrier
            operands: $bar_sync_barrier
            availability:
              ptx: "2.0"
              sm: 20
          - name: barrier_and_thread_count
            operands: $bar_sync_barrier_and_thread_count
            availability:
              ptx: "2.0"
              sm: 20
        rule: parallel_sync_and_communication.bar_sync

        examples:
          - ptx: "bar.sync 0;"
            valid: true
          - ptx: "bar.sync %r1, 128;"
            valid: true

      - name: bar_cta_sync
        description: "bar.cta.sync; semantically equivalent CTA-qualified spelling."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: sync
            kind: flag
            presence: fixed
            value: true
            token: ".sync"
        operand_layouts:
          - name: barrier
            operands: $bar_sync_barrier
          - name: barrier_and_thread_count
            operands: $bar_sync_barrier_and_thread_count
        rule: parallel_sync_and_communication.bar_sync

        examples:
          - ptx: "bar.cta.sync 0;"
            valid: true
          - ptx: "bar.cta.sync %r1, %r2;"
            valid: true

      - name: bar_arrive
        description: "bar.arrive with a CTA barrier identifier and thread count."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: arrive
            kind: flag
            presence: fixed
            value: true
            token: ".arrive"
        operands: $bar_sync_barrier_and_thread_count
        rule: parallel_sync_and_communication.bar_arrive

        examples:
          - ptx: "bar.arrive 0, 64;"
            valid: true

      - name: bar_cta_arrive
        description: "bar.cta.arrive; semantically equivalent CTA-qualified spelling."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: arrive
            kind: flag
            presence: fixed
            value: true
            token: ".arrive"
        operands: $bar_sync_barrier_and_thread_count
        rule: parallel_sync_and_communication.bar_arrive

        examples:
          - ptx: "bar.cta.arrive 0, %r2;"
            valid: true

      - name: bar_red_popc_u32
        description: "bar.red.popc.u32 with an optional thread count."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".popc"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_popc_without_thread_count
          - name: with_thread_count
            operands: $bar_red_popc_with_thread_count
        rule: parallel_sync_and_communication.bar_red_popc

        examples:
          - ptx: "bar.red.popc.u32 %r0, 1, %p1;"
            valid: true
          - ptx: "bar.red.popc.u32 %r0, 1, 64, !%p1;"
            valid: true

      - name: bar_cta_red_popc_u32
        description: "bar.cta.red.popc.u32 with an optional thread count."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".popc"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_popc_without_thread_count
          - name: with_thread_count
            operands: $bar_red_popc_with_thread_count
        rule: parallel_sync_and_communication.bar_red_popc

        examples:
          - ptx: "bar.cta.red.popc.u32 %r0, 1, %p1;"
            valid: true

      - name: bar_red_and_pred
        description: "bar.red.and.pred with an optional thread count."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".and"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_pred_without_thread_count
          - name: with_thread_count
            operands: $bar_red_pred_with_thread_count
        rule: parallel_sync_and_communication.bar_red_and

        examples:
          - ptx: "bar.red.and.pred %p0, 1, %p1;"
            valid: true

      - name: bar_cta_red_and_pred
        description: "bar.cta.red.and.pred with an optional thread count."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".and"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_pred_without_thread_count
          - name: with_thread_count
            operands: $bar_red_pred_with_thread_count
        rule: parallel_sync_and_communication.bar_red_and

        examples:
          - ptx: "bar.cta.red.and.pred %p0, 1, 64, !%p1;"
            valid: true

      - name: bar_red_or_pred
        description: "bar.red.or.pred with an optional thread count."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".or"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_pred_without_thread_count
          - name: with_thread_count
            operands: $bar_red_pred_with_thread_count
        rule: parallel_sync_and_communication.bar_red_or

        examples:
          - ptx: "bar.red.or.pred %p0, 1, 64, %p1;"
            valid: true

      - name: bar_cta_red_or_pred
        description: "bar.cta.red.or.pred with an optional thread count."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".or"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_pred_without_thread_count
          - name: with_thread_count
            operands: $bar_red_pred_with_thread_count
        rule: parallel_sync_and_communication.bar_red_or

        examples:
          - ptx: "bar.cta.red.or.pred %p0, 1, !%p1;"
            valid: true

  - opcode: membar
    doc: "Memory barrier, limited to CTA scope."
    syntax: "membar.cta"

    variants:
      - name: membar_cta
        availability: {ptx: "1.4", sm: 0}
        modifiers:
          - name: scope
            kind: scope
            domain: memory_scopes
            presence: fixed
            value: cta
        operands: []
        rule: parallel_sync_and_communication.membar

        examples:
          - ptx: "membar.cta;"
            valid: true

  - opcode: fence
    doc: "Memory fence, limited to acquire-release CTA scope."
    syntax: "fence.acq_rel.cta"

    variants:
      - name: fence_acq_rel_cta
        availability: {ptx: "6.0", sm: 70}
        modifiers:
          - name: semantics
            kind: semantics
            domain: memory_consistencies
            presence: fixed
            value: acq_rel
          - name: scope
            kind: scope
            domain: memory_scopes
            presence: fixed
            value: cta
        operands: []
        rule: parallel_sync_and_communication.fence

        examples:
          - ptx: "fence.acq_rel.cta;"
            valid: true

  - opcode: atom
    doc: "Atomic operation, limited to relaxed CTA global add.u32."
    syntax: "atom.global.relaxed.cta.add.u32 dst, [address], src"

    variants:
      - name: atom_global_relaxed_cta_add_u32
        availability: {ptx: "6.0", sm: 70}
        modifiers:
          - name: state_space
            kind: state_space
            domain: state_spaces
            presence: fixed
            value: global
          - name: semantics
            kind: semantics
            domain: memory_consistencies
            presence: fixed
            value: relaxed
          - name: scope
            kind: scope
            domain: memory_scopes
            presence: fixed
            value: cta
          - name: add
            kind: flag
            presence: fixed
            value: true
            token: .add
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operands: $atom_global_scalar
        rule: parallel_sync_and_communication.atom
        constraints:
          - kind: address_alignment
            address_operand: address
            type_modifier: type

        examples:
          - ptx: "atom.global.relaxed.cta.add.u32 %r0, [global_value], %r1;"
            valid: true

  - opcode: red
    doc: "Reduction operation, limited to relaxed CTA global add.u32."
    syntax: "red.global.relaxed.cta.add.u32 [address], src"

    variants:
      - name: red_global_relaxed_cta_add_u32
        availability: {ptx: "6.0", sm: 70}
        modifiers:
          - name: state_space
            kind: state_space
            domain: state_spaces
            presence: fixed
            value: global
          - name: semantics
            kind: semantics
            domain: memory_consistencies
            presence: fixed
            value: relaxed
          - name: scope
            kind: scope
            domain: memory_scopes
            presence: fixed
            value: cta
          - name: add
            kind: flag
            presence: fixed
            value: true
            token: .add
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operands: $red_global_scalar
        rule: parallel_sync_and_communication.red
        constraints:
          - kind: address_alignment
            address_operand: address
            type_modifier: type

        examples:
          - ptx: "red.global.relaxed.cta.add.u32 [global_value], %r0;"
            valid: true

  - opcode: activemask
    doc: "Active-lane mask, limited to the b32 destination form."
    syntax: "activemask.b32 dst"

    variants:
      - name: activemask_b32
        availability: {ptx: "6.2", sm: 30}
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: b32
        operands:
          - name: dst
            kind: reg
            role: dst
            access: write
            type: b32
            register_width: exact
        rule: parallel_sync_and_communication.activemask

        examples:
          - ptx: "activemask.b32 %b0;"
            valid: true

  - opcode: vote
    doc: "Vote operation, limited to synchronized ballot.b32."
    syntax: "vote.sync.ballot.b32 dst, predicate, membermask"

    variants:
      - name: vote_sync_ballot_b32
        availability: {ptx: "6.0", sm: 30}
        modifiers:
          - name: sync
            kind: flag
            presence: fixed
            value: true
            token: .sync
          - name: ballot
            kind: flag
            presence: fixed
            value: true
            token: .ballot
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: b32
        operands: $vote_sync_ballot
        rule: parallel_sync_and_communication.vote

        examples:
          - ptx: "vote.sync.ballot.b32 %b0, %p0, 0xffffffff;"
            valid: true
