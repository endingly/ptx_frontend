# PTX warp-level matrix multiply-accumulate instructions.
# yaml-language-server: $schema=../schemas/ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: warp_level_matrix_multiply_accumulate
codegen_category: matrix
section: "9.7.15"

operand_patterns:
  mma_m16n8k8_f32_f16:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type: f32
      vector: {kind: matrix_fragment, arity: [4], type_policy: element}
    - name: a
      kind: reg_vector
      role: src1
      access: read
      type: f16x2
      vector: {kind: matrix_fragment, arity: [2], type_policy: element}
    - name: b
      kind: reg_vector
      role: src2
      access: read
      type: f16x2
      vector: {kind: matrix_fragment, arity: [1], type_policy: element}
    - name: c
      kind: reg_vector
      role: src3
      access: read
      type: f32
      vector: {kind: matrix_fragment, arity: [4], type_policy: element}

  ldmatrix_m8n8_x2_shared_b16:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type: b32
      vector: {kind: matrix_fragment, arity: [2], type_policy: element}
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [shared]

instructions:
  - opcode: mma
    section: "9.7.15.5.14"
    doc: "Matrix multiply-accumulate, limited to m16n8k8 f16 inputs and f32 accumulation."
    syntax: >-
      mma.sync.aligned.m16n8k8.row.col.f32.f16.f16.f32
      {dst0, dst1, dst2, dst3}, {a0, a1}, {b0}, {c0, c1, c2, c3}
    operands: $mma_m16n8k8_f32_f16
    variants:
      - name: mma_sync_aligned_m16n8k8_row_col_f32_f16_f16_f32
        availability: {ptx: "6.5", sm: 75}
        modifiers:
          - {name: sync, kind: flag, presence: fixed, value: true, token: .sync}
          - {name: aligned, kind: flag, presence: fixed, value: true, token: .aligned}
          - {name: m16n8k8, kind: flag, presence: fixed, value: true, token: .m16n8k8}
          - {name: row, kind: flag, presence: fixed, value: true, token: .row}
          - {name: col, kind: flag, presence: fixed, value: true, token: .col}
          - {name: d_type, kind: type, domain: scalar_types, presence: fixed, value: f32}
          - {name: a_type, kind: type, domain: scalar_types, presence: fixed, value: f16}
          - {name: b_type, kind: type, domain: scalar_types, presence: fixed, value: f16}
          - {name: c_type, kind: type, domain: scalar_types, presence: fixed, value: f32}
        rule: matrix.mma
        examples:
          - ptx: >-
              mma.sync.aligned.m16n8k8.row.col.f32.f16.f16.f32
              {%d0, %d1, %d2, %d3}, {%a0, %a1}, {%b0}, {%c0, %c1, %c2, %c3};
            valid: true

  - opcode: ldmatrix
    section: "9.7.15.5.15"
    doc: "Matrix load, limited to synchronized aligned m8n8.x2 shared b16."
    syntax: "ldmatrix.sync.aligned.m8n8.x2.shared.b16 {dst0, dst1}, [address]"
    variants:
      - name: ldmatrix_sync_aligned_m8n8_x2_shared_b16
        availability: {ptx: "6.5", sm: 75}
        modifiers:
          - {name: sync, kind: flag, presence: fixed, value: true, token: .sync}
          - {name: aligned, kind: flag, presence: fixed, value: true, token: .aligned}
          - {name: m8n8, kind: flag, presence: fixed, value: true, token: .m8n8}
          - {name: x2, kind: flag, presence: fixed, value: true, token: .x2}
          - {name: shared, kind: flag, presence: fixed, value: true, token: .shared}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: b16}
        operands: $ldmatrix_m8n8_x2_shared_b16
        rule: data_movement.ldmatrix
        constraints:
          - kind: address_alignment
            address_operand: address
            alignment: 16
        examples:
          - ptx: "ldmatrix.sync.aligned.m8n8.x2.shared.b16 {%r0, %r1}, [shared_value];"
            valid: true
