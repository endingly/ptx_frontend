# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema

$schema: https://json-schema.org/draft/2020-12/schema
title: PTX 9.3 directive registry
type: object
additionalProperties: false
required: [schema, version, ptx_isa, source_url, evidence_url, records]
properties:
  schema:
    const: ptx-directive-registry/v1
  version:
    const: 1
  ptx_isa:
    const: "9.3"
  source_url:
    const: https://docs.nvidia.com/cuda/parallel-thread-execution/
  evidence_url:
    const: https://docs.nvidia.com/cuda/parallel-thread-execution/contents.html
  records:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - ptx_isa
        - source_scope
        - source_section
        - source_title
        - source_anchor
        - kind
        - spelling
      properties:
        id:
          type: string
          pattern: ^ptx-9-3-[a-z0-9-]+$
        ptx_isa:
          const: "9.3"
        source_scope:
          enum: [chapter_11, chapter_12, supplemental_official]
        source_section:
          type: string
          pattern: ^(?:[45]|1[12])(?:\.[0-9]+)+$
        source_title:
          type: string
          minLength: 1
        source_anchor:
          type: string
          pattern: ^[a-z0-9-]+$
        kind:
          enum: [directive, pragma_string, legacy_construct]
        spelling:
          type: string
          minLength: 1
