# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema

$schema: https://json-schema.org/draft/2020-12/schema
title: PTX 9.3 instruction registry
type: object
additionalProperties: false
required: [schema, version, ptx_isa, source_url, evidence_url, evidence, families, records]
properties:
  schema:
    const: ptx-instruction-registry/v1
  version:
    const: 1
  ptx_isa:
    const: "9.3"
  source_url:
    const: https://docs.nvidia.com/cuda/parallel-thread-execution/
  evidence_url:
    const: https://docs.nvidia.com/cuda/parallel-thread-execution/contents.html
  evidence:
    const: NVIDIA PTX ISA 9.3 Contents, section 9.7
  families:
    type: array
    minItems: 20
    items:
      type: object
      additionalProperties: false
      required: [id, section, title, anchor]
      properties:
        id:
          pattern: ^[a-z][a-z0-9-]*$
        section:
          pattern: ^9\.7\.(?:[1-9]|1[0-9]|20)$
        title:
          type: string
          minLength: 1
        anchor:
          pattern: ^[a-z0-9-]+$
  records:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, ptx_isa, family, section, title, opcodes, anchor]
      properties:
        id:
          pattern: ^ptx-9-3-[a-z0-9-]+$
        ptx_isa:
          const: "9.3"
        family:
          pattern: ^[a-z][a-z0-9-]*$
        section:
          pattern: ^9\.7(?:\.[0-9]+)+$
        title:
          type: string
          minLength: 1
        opcodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        record_kind:
          description: Omitted means opcode.
          default: opcode
          enum: [opcode, syntax_construct, instruction_family]
        anchor:
          pattern: ^[a-z0-9-]+$
