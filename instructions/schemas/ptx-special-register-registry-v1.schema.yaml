# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema

$schema: https://json-schema.org/draft/2020-12/schema
title: PTX 9.3 special-register registry
type: object
additionalProperties: false
required: [schema, version, ptx_isa, source_url, evidence_url, records]
properties:
  schema:
    const: ptx-special-register-registry/v1
  version:
    const: 1
  ptx_isa:
    const: "9.3"
  source_url:
    const: https://docs.nvidia.com/cuda/parallel-thread-execution/
  evidence_url:
    const: https://docs.nvidia.com/cuda/parallel-thread-execution/contents.html
  records:
    type: array
    minItems: 33
    items:
      type: object
      additionalProperties: false
      required: [id, ptx_isa, section, title, anchor, forms]
      properties:
        id:
          pattern: ^ptx-9-3-special-registers-[a-z0-9-]+$
        ptx_isa:
          const: "9.3"
        section:
          pattern: ^10\.(?:[1-9]|[12][0-9]|3[0-3])$
        title:
          type: string
          minLength: 1
        anchor:
          pattern: ^special-registers-[a-z0-9-]+$
        forms:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [spellings, shape, type, min_ptx, min_sm]
            properties:
              spellings:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  pattern: ^%[a-z0-9_.]+$
              shape:
                enum: [scalar, vector4]
              type:
                enum: [u32, u64, b32, pred]
              min_ptx:
                description: Minimum PTX for this current type/shape form, not the register identity's first appearance.
                pattern: ^[0-9]+\.[0-9]+$
              min_sm:
                type: integer
                minimum: 0
