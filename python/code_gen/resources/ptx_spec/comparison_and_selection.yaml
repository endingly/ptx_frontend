# PTX comparison and selection instructions.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: comparison_and_selection
codegen_category: arithmetic
section: "9.7.6"

operand_patterns:
  set_eq_u32_u32:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
    - name: src1
      kind: reg_or_imm
      role: src1
      access: read
      type: u32
    - name: src2
      kind: reg_or_imm
      role: src2
      access: read
      type: u32

  set_lt_and_f32_s32:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: f32
    - name: src1
      kind: reg_or_imm
      role: src1
      access: read
      type: s32
    - name: src2
      kind: reg_or_imm
      role: src2
      access: read
      type: s32
    - name: combine
      kind: pred_or_not
      role: predicate
      access: read
      type: pred

  setp_scalar_single:
    - {name: dst, kind: pred_or_sink, role: dst, access: write, type: pred}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}

  setp_scalar_pair:
    - {name: dst, kind: pred_pair_or_sink, role: dst, access: write, type: pred}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}

  setp_scalar_single_boolean:
    - {name: dst, kind: pred_or_sink, role: dst, access: write, type: pred}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_scalar_pair_boolean:
    - {name: dst, kind: pred_pair_or_sink, role: dst, access: write, type: pred}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_f16_single:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: f16}
    - {name: src2, kind: reg, role: src2, access: read, type: f16}

  setp_f16_single_boolean:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: f16}
    - {name: src2, kind: reg, role: src2, access: read, type: f16}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_packed_pair:
    - {name: dst, kind: pred_pair, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}

  setp_packed_pair_boolean:
    - {name: dst, kind: pred_pair, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_bf16_single:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}

  setp_bf16_single_boolean:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}
  selp_u32:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
    - name: src_true
      kind: reg_or_imm
      role: src1
      access: read
      type: u32
    - name: src_false
      kind: reg_or_imm
      role: src2
      access: read
      type: u32
    - name: predicate
      kind: pred
      role: predicate
      access: read
      type: pred

  slct_u32_s32:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
      register_width: same_width
    - name: src_true
      kind: reg
      role: src1
      access: read
      type: u32
      register_width: same_width
    - name: src_false
      kind: reg
      role: src2
      access: read
      type: u32
      register_width: same_width
    - name: selector
      kind: reg
      role: src3
      access: read
      type: s32
      register_width: same_width

  slct_ftz_u64_f32:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u64
      register_width: same_width
    - name: src_true
      kind: reg
      role: src1
      access: read
      type: u64
      register_width: same_width
    - name: src_false
      kind: reg
      role: src2
      access: read
      type: u64
      register_width: same_width
    - name: selector
      kind: reg
      role: src3
      access: read
      type: f32
      register_width: same_width

instructions:
  - opcode: set
    section: "9.7.6.1"
    doc: "Frozen scalar comparison results for one unsigned equality and one signed predicate-combined comparison."
    syntax: "set.eq.u32.u32 dst, src1, src2 | set.lt.and.f32.s32 dst, src1, src2, combine"
    variants:
      - name: set_eq_u32_u32
        description: "Unsigned equality with a .u32 result."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: comparison
            kind: comparison
            domain: comparison_operators
            presence: required
            values: [eq]
          - name: boolean
            kind: boolean_op
            domain: boolean_operators
            presence: absent
          - name: dtype
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
          - name: stype
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operands: $set_eq_u32_u32
        examples:
          - ptx: "set.eq.u32.u32 %r0, %r1, 16;"
            valid: true
      - name: set_lt_and_f32_s32
        description: "Signed less-than combined with one predicate and materialized as .f32."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: comparison
            kind: comparison
            domain: comparison_operators
            presence: required
            values: [lt]
          - name: boolean
            kind: boolean_op
            domain: boolean_operators
            presence: required
            values: [and]
          - name: dtype
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
          - name: stype
            kind: type
            domain: scalar_types
            presence: fixed
            value: s32
        operands: $set_lt_and_f32_s32
        examples:
          - ptx: "set.lt.and.f32.s32 %f0, %s0, -1, !%p0;"
            valid: true
  - opcode: setp
    section: "9.7.6.2"
    doc: "Complete PTX 9.3 ordinary, half, and bfloat predicate comparisons with descriptor-driven type, sink, and availability contracts."
    syntax: "setp.CmpOp{.BoolOp}{.ftz}.{type} p[|q], a, b{, {!}c}"
    variants:
      - name: setp_bit
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: required, values: [b16, b32, b64]}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single}
          - {name: pair, operands: $setp_scalar_pair}

      - name: setp_bit_boolean
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: required, values: [b16, b32, b64]}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single_boolean}
          - {name: pair, operands: $setp_scalar_pair_boolean}

      - name: setp_signed
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: required, values: [s16, s32, s64]}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single}
          - {name: pair, operands: $setp_scalar_pair}

      - name: setp_signed_boolean
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: required, values: [s16, s32, s64]}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single_boolean}
          - {name: pair, operands: $setp_scalar_pair_boolean}

      - name: setp_unsigned
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, lo, ls, hi, hs]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: required, values: [u16, u32, u64]}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single}
          - {name: pair, operands: $setp_scalar_pair}

      - name: setp_unsigned_boolean
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, lo, ls, hi, hs]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: required, values: [u16, u32, u64]}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single_boolean}
          - {name: pair, operands: $setp_scalar_pair_boolean}

      - name: setp_float
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: optional, default: false, token: .ftz}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f32}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single}
          - {name: pair, operands: $setp_scalar_pair}

      - name: setp_float_boolean
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: optional, default: false, token: .ftz}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f32}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single_boolean}
          - {name: pair, operands: $setp_scalar_pair_boolean}

      - name: setp_float_f64
        availability: {ptx: "1.0", sm: 13}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f64}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single}
          - {name: pair, operands: $setp_scalar_pair}

      - name: setp_float_f64_boolean
        availability: {ptx: "1.0", sm: 13}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f64}
        operand_layouts:
          - {name: single, operands: $setp_scalar_single_boolean}
          - {name: pair, operands: $setp_scalar_pair_boolean}

  - opcode: setp
    section: "9.7.7.2"
    doc: "Complete PTX 9.3 half and bfloat predicate comparisons with descriptor-driven type, destination, and availability contracts."
    syntax: "setp.CmpOp{.BoolOp}{.ftz}.{f16|f16x2|bf16|bf16x2} p[|q], a, b{, {!}c}"
    variants:
      - name: setp_f16
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: optional, default: false, token: .ftz}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f16}
        operands: $setp_f16_single

      - name: setp_f16_boolean
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: optional, default: false, token: .ftz}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f16}
        operands: $setp_f16_single_boolean

      - name: setp_f16x2
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: optional, default: false, token: .ftz}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f16x2}
        operands: $setp_packed_pair

      - name: setp_f16x2_boolean
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: optional, default: false, token: .ftz}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: f16x2}
        operands: $setp_packed_pair_boolean

      - name: setp_bf16
        availability: {ptx: "7.8", sm: 90}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: bf16}
        operands: $setp_bf16_single

      - name: setp_bf16_boolean
        availability: {ptx: "7.8", sm: 90}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: bf16}
        operands: $setp_bf16_single_boolean

      - name: setp_bf16x2
        availability: {ptx: "7.8", sm: 90}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: bf16x2}
        operands: $setp_packed_pair

      - name: setp_bf16x2_boolean
        availability: {ptx: "7.8", sm: 90}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: bf16x2}
        operands: $setp_packed_pair_boolean
  - opcode: selp
    section: "9.7.6.3"
    doc: "Select between two .u32 values using one predicate."
    syntax: "selp.u32 dst, src_true, src_false, predicate"
    operands: $selp_u32
    variants:
      - name: selp_u32
        description: "32-bit unsigned predicate selection."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        examples:
          - ptx: "selp.u32 %r0, %r1, 0, %p0;"
            valid: true
  - opcode: slct
    section: "9.7.6.4"
    doc: "Select one same-width data operand by the sign of a numeric selector."
    syntax: "slct.u32.s32 dst, src_true, src_false, selector | slct.ftz.u64.f32 dst, src_true, src_false, selector"
    variants:
      - name: slct_u32_s32
        description: "32-bit data selection with a signed 32-bit numeric selector."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: ftz
            kind: flag
            presence: absent
          - name: dtype
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
          - name: stype
            kind: type
            domain: scalar_types
            presence: fixed
            value: s32
        operands: $slct_u32_s32
        examples:
          - ptx: "slct.u32.s32 %r0, %r1, %r2, %r3;"
            valid: true
      - name: slct_ftz_u64_f32
        description: "64-bit data selection with an .ftz single-precision numeric selector."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: ftz
            kind: flag
            presence: fixed
            value: true
            token: .ftz
          - name: dtype
            kind: type
            domain: scalar_types
            presence: fixed
            value: u64
          - name: stype
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
        operands: $slct_ftz_u64_f32
        examples:
          - ptx: "slct.ftz.u64.f32 %rd0, %rd1, %rd2, %f0;"
            valid: true
