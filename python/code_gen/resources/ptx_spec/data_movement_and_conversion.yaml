# PTX data movement and conversion instructions.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: data_movement_and_conversion
codegen_category: data_movement
section: "9.7.9"

type_sets:
  ld_st_scalar_types:
    - b8
    - b16
    - b32
    - b64
    - u8
    - u16
    - u32
    - u64
    - s8
    - s16
    - s32
    - s64
    - f32

value_sets:
  ld_cache_operators: [ca, cg, cs, lu, cv]
  ld_nc_cache_operators: [ca, cg, cs]
  st_cache_operators: [wb, cg, cs, wt]

operand_patterns:
  mov_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: mov_scalar_src
      role: src
      access: read
      type:
        expr: modifier(type)

  mapa_shared_cluster:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: same_width
    - name: src
      kind: cluster_address
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: same_width
      state_space: [shared]
    - name: rank
      kind: reg_or_imm
      role: src
      access: read
      type: u32
      register_width: same_width
      immediate_conversion: require_target_range

  mapa_generic:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: same_width
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: same_width
    - name: rank
      kind: reg_or_imm
      role: src
      access: read
      type: u32
      register_width: same_width
      immediate_conversion: require_target_range

  getctarank_shared_cluster:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
      register_width: same_width
    - name: src
      kind: cluster_address
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: same_width
      state_space: [shared]

  getctarank_generic:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
      register_width: same_width
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: same_width

  mov_pred:
    - name: dst
      kind: pred
      role: dst
      access: write
      type: pred
    - name: src
      kind: pred_or_sreg
      role: src
      access: read
      type: pred

  mov_v4_u32:
    - name: dst
      kind: vector_reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
    - name: src
      kind: vector_sreg
      role: src
      access: read
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element

  cvt_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(dst_type)
      register_width: equal_or_wider
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(src_type)
      register_width: equal_or_wider

  cvt_rn_f32_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: f32, register_width: same_width}
    - {name: src, kind: reg, role: src, access: read, type: s32, register_width: equal_or_wider}

  cvt_rn_f16x2_f32:
    - {name: dst, kind: reg, role: dst, access: write, type: f16x2, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f32, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f32, register_width: same_width}

  cvt_pack_sat_u8_s32_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: s32, register_width: equal_or_wider}
    - {name: src2, kind: reg, role: src2, access: read, type: s32, register_width: equal_or_wider}
    - {name: carry, kind: reg, role: src3, access: read, type: b32, register_width: same_width}

  cvta_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)

  prmt_generic_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: same_width}
    - {name: selector, kind: imm, role: src, access: read, type: u32}

  prmt_f4e_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: same_width}
    - {name: selector, kind: reg, role: src3, access: read, type: b32, register_width: same_width}

  mov_pack:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity: [2, 4]

  mov_unpack:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity: [2, 4]
        allow_sink: true
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
  ld_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        - value: const
          availability:
            ptx: "3.1"
        - global
        - local
        - shared

  ld_explicit_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: input
        function_availability:
          ptx: "2.0"
          sm: 20

  ld_explicit_scalar_cache_policy:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  ld_scalar_cache_policy:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      # Cache-policy loads permit unresolved generic registers, but a known
      # provenance must be global.
      state_space: [global]
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  ld_explicit_scalar_global:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)

  ld_scalar_global:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      # This is a generic spelling; unknown register provenance remains valid.
      state_space: [global]

  prefetch_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)

  prefetchu_generic:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [generic]

  createpolicy_fractional_l2_evict_last:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: b64
    - name: fraction
      kind: imm
      role: src
      access: read
      type: f32

  applypriority_global_l2_evict_normal:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: size
      kind: imm
      role: src
      access: read
      type: u32

  cp_async_shared_global:
    - name: dst
      kind: addr
      role: addr
      access: write
      state_space: [shared]
    - name: src
      kind: addr
      role: addr
      access: read
      state_space: [global]
    - name: cp_size
      kind: imm
      role: src
      access: read
      type: u32

  cp_async_mbarrier_arrive_address:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [shared]

  isspacep_global_u64:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src, kind: reg, role: src, access: read, type: u64, register_width: same_width}

  shfl_sync_idx:
    - name: dst
      kind: shfl_dest
      role: dst
      access: write
      type: b32
    - name: src
      kind: reg
      role: src
      access: read
      type: b32
    - name: lane
      kind: reg_or_imm
      role: src
      access: read
      type: u32
    - name: clamp
      kind: reg_or_imm
      role: src
      access: read
      type: u32
    - name: membermask
      kind: reg_or_imm
      role: src
      access: read
      type: u32

  ld_vector:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        - value: const
          availability:
            ptx: "3.1"
        - global
        - local
        - shared

  ld_explicit_vector:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: input
        function_availability:
          ptx: "2.0"
          sm: 20

  ld_explicit_vector_global:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)

  ld_explicit_vector_cache_policy_global:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  ld_vector_cache_policy:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      # Cache-policy loads permit unresolved generic registers, but a known
      # provenance must be global.
      state_space: [global]
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  ld_vector_global:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      # This is a generic spelling; unknown register provenance remains valid.
      state_space: [global]

  st_scalar:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [global, local, shared]
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider

  st_scalar_global:
    - name: address
      kind: addr
      role: addr
      access: read
      # This generic spelling retains unknown register provenance but rejects a
      # statically known non-global address.
      state_space: [global]
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider

  st_vector:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [global, local, shared]
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256

  st_vector_global:
    - name: address
      kind: addr
      role: addr
      access: read
      # This generic spelling retains unknown register provenance but rejects a
      # statically known non-global address.
      state_space: [global]
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256

  st_explicit_vector:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: return
        function_availability:
          ptx: "2.0"
          sm: 20
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256

  st_explicit_vector_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256

  st_explicit_vector_cache_policy_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  st_explicit_scalar:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: return
        function_availability:
          ptx: "2.0"
          sm: 20
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider

  st_explicit_scalar_cache_policy:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  st_scalar_cache_policy_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [global]
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  st_vector_cache_policy_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [global]
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  st_explicit_scalar_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: equal_or_wider

instructions:
  - opcode: isspacep
    section: "9.7.9.20"
    doc: "Test whether a bare u64 general register belongs to global address space."
    syntax: "isspacep.global dst, src"
    operands: $isspacep_global_u64
    variants:
      - name: isspacep_global_u64
        description: "Register-only global address-space predicate test."
        availability: {ptx: "2.0", sm: 20}
        modifiers:
          - {name: state_space, kind: state_space, domain: memory_state_spaces, presence: fixed, value: global}
        examples:
          - {ptx: "isspacep.global %p0, %rd0;", valid: true}

  - opcode: cvta
    section: "9.7.9.21"
    doc: "Convert register-only global and generic u64 addresses."
    syntax: "cvta.global.u64 dst, src | cvta.to.global.u64 dst, src"
    operands: $cvta_register
    variants:
      - name: cvta_global_u64
        description: "Register-only global-to-generic u64 address conversion."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: to
            kind: flag
            presence: absent
            token: ".to"
          - name: state_space
            kind: state_space
            domain: memory_state_spaces
            presence: fixed
            value: global
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u64
        examples:
          - ptx: "cvta.global.u64 %rd0, %rd1;"
            valid: true
      - name: cvta_to_global_u64
        description: "Register-only generic-to-global u64 address conversion."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: to
            kind: flag
            presence: fixed
            value: true
            token: ".to"
          - name: state_space
            kind: state_space
            domain: memory_state_spaces
            presence: fixed
            value: global
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u64
        examples:
          - ptx: "cvta.to.global.u64 %rd0, %rd1;"
            valid: true

  - opcode: cvt
    section: "9.7.9.22"
    doc: "Convert frozen register-only integer and floating-point forms, including one packed f16x2 result."
    syntax: "cvt.s32.u32 dst, src | cvt.rn.f32.f64 dst, src | cvt.rn.f32.u32 dst, src | cvt.rn.f32.s32 dst, src | cvt.rzi.u32.f32 dst, src | cvt.rn.f16x2.f32 dst, src1, src2"
    operands: $cvt_scalar
    variants:
      - name: cvt_s32_u32
        description: "Register-only unsigned 32-bit to signed 32-bit conversion."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: s32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        examples:
          - ptx: "cvt.s32.u32 %s0, %r0;"
            valid: true
      - name: cvt_rn_f32_f64
        description: "Register-only round-to-nearest f64 to f32 conversion."
        availability:
          ptx: "1.0"
          sm: 13
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rn
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f64
        examples:
          - ptx: "cvt.rn.f32.f64 %f0, %fd0;"
            valid: true
      - name: cvt_rn_f32_u32
        description: "Register-only round-to-nearest u32 to f32 conversion."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rn
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        examples:
          - ptx: "cvt.rn.f32.u32 %f0, %r0;"
            valid: true
      - name: cvt_rn_f32_s32
        description: "Register-only round-to-nearest signed 32-bit to f32 conversion."
        operands: $cvt_rn_f32_s32
