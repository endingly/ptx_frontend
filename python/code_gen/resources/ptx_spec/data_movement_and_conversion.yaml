          - *memory_scope
          - name: state_space
            kind: state_space
            domain: state_spaces
            presence: required
            values: [const, global, local, param, {value: param::entry, availability: {ptx: "8.3"}}, {value: param::func, availability: {ptx: "8.3"}}, shared]
          - name: cache
            kind: cache
            domain: cache_operators
            presence: optional
            values:
              - value: $ld_cache_operators
                availability: {ptx: "2.0", sm: 20}
            default: unspecified
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $ld_st_scalar_types
              - {value: b128, availability: {ptx: "8.3", sm: 70}}
              - value: f64
                availability:
                  ptx: "1.0"
                  sm: 13
        modifier_order_aliases:
