  - opcode: ld
    section: "9.7.9.8"
    doc: >
      Scalar and legacy v2/v4 forms, plus PTX 8.8 256-bit v8 32-bit and v4
      64-bit vector loads through a generic address or explicit global space.
      Alignment and other qualifiers remain separate coverage.
    syntax: "ld{.const|.global|.local|.param|.param::entry|.param::func|.shared}{.v2|.v4|.v8}.{b8|b16|b32|b64|u8|u16|u32|u64|s8|s16|s32|s64|f32|f64} dst, [address]"

    variants:
      - name: ld_generic_scalar
        permits_unified_address: true
        unified_address_access: read
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - &memory_mmio
            name: mmio
            kind: flag
            presence: optional
            values:
              - value: true
                token: .mmio
                availability: {ptx: "8.2", sm: 70}
            default: false
          - &ld_semantics
            name: semantics
            kind: semantics
            domain: memory_consistencies
            presence: optional
            values:
              - value: weak
                availability: {ptx: "6.0", sm: 70}
              - value: volatile
                availability: {ptx: "1.1"}
              - value: relaxed
                availability: {ptx: "6.0", sm: 70}
              - value: acquire
                availability: {ptx: "6.0", sm: 70}
            default: omitted
          - &memory_scope
            name: scope
            kind: scope
            domain: memory_scopes
            presence: optional
            values:
              - value: cta
                availability: {ptx: "6.0", sm: 70}
              - value: cluster
                availability:
                  any_of: [{ptx: "7.8", sm: 90, capabilities: [cluster]}]
              - value: gpu
                availability: {ptx: "6.0", sm: 70}
              - value: sys
                availability: {ptx: "6.0", sm: 70}
            default: none
          - name: cache
            kind: cache
            domain: cache_operators
            presence: optional
            values:
              - value: $ld_cache_operators
                availability: {ptx: "2.0", sm: 20}
            default: unspecified
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - $ld_st_scalar_types
              - {value: b128, availability: {ptx: "8.3", sm: 70}}
              - f64
        modifier_order_aliases:
          - [semantics, scope, mmio, cache, type]
        operands: $ld_scalar
        rule: data_movement.ld_generic
        constraints:
          - kind: memory_consistency
            semantics_modifier: semantics
            scope_modifier: scope
            mmio_modifier: mmio
            cache_modifier: cache
            address_operand: address
            type_modifier: type
            mmio_semantics:
              - relaxed
              - value: acquire
                availability: {ptx: "9.3", sm: 75}
          - kind: address_alignment
            address_operand: address
            type_modifier: type

        examples:
          - ptx: "ld.u32 %r0, [%rd0+4];"
            valid: true
          - ptx: "ld.u32 %r0, [global_value];"
            valid: true

