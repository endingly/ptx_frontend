[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptx_frontend"
version = "0.1.0b0"
description = "PTX frontend reusable Python models and resources"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
test = [
    "pytest",
    "unittest-parallel>=1.8.6,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "ptx_frontend.code_gen._frontend",
    "ptx_frontend.code_gen._frontend.*",
]

[tool.setuptools.package-data]
"ptx_frontend.spec.resources" = [
    "*.yaml",
    "ptx_cpp_backend_spec/*.yaml",
    "ptx_spec/*.yaml",
]
