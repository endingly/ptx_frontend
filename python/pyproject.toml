[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptx_frontend"
version = "0.0.1b0"
description = "PTX frontend reusable Python models and resources"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
test = [
    "pytest",
    "unittest-parallel>=1.8.6,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ptx_frontend.code_gen.resources" = [
    "*.yaml",
    "ptx_cpp_backend_spec/*.yaml",
    "ptx_spec/*.yaml",
]