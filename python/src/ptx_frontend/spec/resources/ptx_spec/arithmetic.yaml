# PTX integer, floating-point, half-precision, and mixed-precision arithmetic.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: arithmetic
codegen_category: arithmetic
doc: "Merged PTX ISA 9.3 arithmetic categories 9.7.1 through 9.7.5."

type_sets:
  add_integer_scalar: [u16, u32, u64, s16, s32, s64]
  add_simd_no_sat: [u16x2, s16x2]
  add_packed_optional_sat: [u8x4, s8x4]
  add_late_sat: [u16x2, s16x2, u32]
  sub_integer_scalar: [u16, u32, u64, s16, s64]
  sub_optional_sat: [s32, u8x4, s8x4]

  add_half_types:
    - f16
    - f16x2

  add_bfloat_types:
    - bf16
    - bf16x2

value_sets:
  rounding_modes:
    - rn
    - rz
    - rm
    - rp

operand_patterns:
  binary_arith:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}

  unary_float_register_or_immediate:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: {expr: "modifier(type)"}, register_width: same_width}

  unary_integer_arith:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: {expr: "modifier(type)"}}

  unary_f16x2_register:
    - {name: dst, kind: reg, role: dst, access: write, type: f16x2, register_width: same_width}
    - {name: src, kind: reg, role: src, access: read, type: f16x2, register_width: same_width}

  unary_f16_register:
    - {name: dst, kind: reg, role: dst, access: write, type: f16, register_width: same_width}
    - {name: src, kind: reg, role: src, access: read, type: f16, register_width: same_width}

  unary_b16_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: exact}
    - {name: src, kind: reg, role: src, access: read, type: b16, register_width: exact}

  unary_b32_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: exact}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: exact}

  popc_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: b32, register_width: same_width}

  popc_b64:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: b64, register_width: same_width}

  clz_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: b32, register_width: same_width}

  clz_b64:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: b64, register_width: same_width}

  bfind_shiftamt_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: u32, register_width: same_width}

  bfind_u64:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: u64, register_width: same_width}

  bfind_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: s32, register_width: same_width}

  bfind_s64:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: s64, register_width: same_width}

  bfe_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: same_width}
    - {name: offset, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}

  bfe_u64:
    - {name: dst, kind: reg, role: dst, access: write, type: u64, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src1, access: read, type: u64, register_width: same_width}
    - {name: offset, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}

  bfe_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: s32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src1, access: read, type: s32, register_width: same_width}
    - {name: offset, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}

  bfe_s64:
    - {name: dst, kind: reg, role: dst, access: write, type: s64, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src1, access: read, type: s64, register_width: same_width}
    - {name: offset, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}

  bfi_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: insert, kind: reg_or_imm, role: src1, access: read, type: b32, register_width: same_width}
    - {name: base, kind: reg_or_imm, role: src2, access: read, type: b32, register_width: same_width}
    - {name: offset, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}

  bfi_b64:
    - {name: dst, kind: reg, role: dst, access: write, type: b64, register_width: same_width}
    - {name: insert, kind: reg_or_imm, role: src1, access: read, type: b64, register_width: same_width}
    - {name: base, kind: reg_or_imm, role: src2, access: read, type: b64, register_width: same_width}
    - {name: offset, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}

  brev_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: b32, register_width: same_width}

  brev_b64:
    - {name: dst, kind: reg, role: dst, access: write, type: b64, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: b64, register_width: same_width}

  binary_wide_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u64, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}

  binary_wide_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: s64}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: s32}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: s32}

  binary_wide_u16:
    - {name: dst, kind: reg, role: dst, access: write, type: u32}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: u16}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: u16}

  binary_wide_s16:
    - {name: dst, kind: reg, role: dst, access: write, type: s32}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: s16}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: s16}

  binary_b16_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}

  binary_b32_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}

  binary_b64_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b64, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: b64, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b64, register_width: exact}

  ternary_arith:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: {expr: "modifier(type)"}}

  ternary_b16_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}
    - {name: src3, kind: reg, role: src3, access: read, type: b16, register_width: exact}

  ternary_b32_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}
    - {name: src3, kind: reg, role: src3, access: read, type: b32, register_width: exact}

  ternary_b64_register_exact:
    - {name: dst, kind: reg, role: dst, access: write, type: b64, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: b64, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b64, register_width: exact}
    - {name: src3, kind: reg, role: src3, access: read, type: b64, register_width: exact}

  ternary_mixed_f16:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(result_type)"}}
    - {name: src1, kind: reg, role: src1, access: read, type: {expr: "modifier(input_type)"}}
    - {name: src2, kind: reg, role: src2, access: read, type: {expr: "modifier(input_type)"}}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: {expr: "modifier(result_type)"}}

  ternary_mixed_bf16:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(result_type)"}}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: {expr: "modifier(result_type)"}}

  ternary_wide_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u64, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: u64, register_width: same_width}

  ternary_wide_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: s64, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: s32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: s32, register_width: same_width}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: s64, register_width: same_width}

  ternary_wide_u16:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: u16, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: u16, register_width: same_width}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}

  ternary_wide_s16:
    - {name: dst, kind: reg, role: dst, access: write, type: s32, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: s16, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: s16, register_width: same_width}
    - {name: src3, kind: reg_or_imm, role: src3, access: read, type: s32, register_width: same_width}

  fns_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: mask, kind: reg_or_imm, role: src1, access: read, type: b32, register_width: same_width}
    - {name: base, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}
    - {name: offset, kind: reg_or_imm, role: src3, access: read, type: s32, register_width: same_width}

  szext_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}

  szext_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: s32, register_width: same_width}
    - {name: src, kind: reg_or_imm, role: src1, access: read, type: s32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}

  bmsk_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: position, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: same_width}
    - {name: width, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}

  dp_u32_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}
    - {name: accumulator, kind: reg_or_imm, role: src3, access: read, type: u32, register_width: same_width}

  dp_u32_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: s32, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: u32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: s32, register_width: same_width}
    - {name: accumulator, kind: reg_or_imm, role: src3, access: read, type: s32, register_width: same_width}

  dp_s32_u32:
    - {name: dst, kind: reg, role: dst, access: write, type: s32, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: s32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: u32, register_width: same_width}
    - {name: accumulator, kind: reg_or_imm, role: src3, access: read, type: s32, register_width: same_width}

  dp_s32_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: s32, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: s32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: s32, register_width: same_width}
    - {name: accumulator, kind: reg_or_imm, role: src3, access: read, type: s32, register_width: same_width}

  binary_float_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)

    - name: src1
      kind: reg_or_imm
      role: src1
      access: read
      type:
        expr: modifier(type)

    - name: src2
      kind: reg_or_imm
      role: src2
      access: read
      type:
        expr: modifier(type)

  testp_float_scalar:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - name: src
      kind: reg_or_imm
      role: src1
      access: read
      type: {expr: "modifier(type)"}
      register_width: same_width

  copysign_float_scalar:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}, register_width: same_width}
    - {name: sign_source, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}, register_width: same_width}
    - {name: magnitude_source, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}, register_width: same_width}

  binary_float_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)

    - name: src1
      kind: reg
      role: src1
      access: read
      type:
        expr: modifier(type)

    - name: src2
      kind: reg
      role: src2
      access: read
      type:
        expr: modifier(type)

  ternary_float_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)

    - name: src1
      kind: reg
      role: src1
      access: read
      type:
        expr: modifier(type)

    - name: src2
      kind: reg
      role: src2
      access: read
      type:
        expr: modifier(type)

    - name: src3
      kind: reg
      role: src3
      access: read
      type:
        expr: modifier(type)

  binary_mixed_float_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(result_type)

    - name: src
      kind: reg
      role: src1
      access: read
      type:
        expr: modifier(input_type)

    - name: addend
      kind: reg
      role: src2
      access: read
      type:
        expr: modifier(result_type)

instructions:
  - opcode: add
    section: "9.7.3.3"
    doc: "Standard floating-point add."
    syntax: >-
      add{.rnd}{.ftz}{.sat}.f32 | add{.rnd}{.ftz}.f32x2 |
      add{.rnd}.f64 dst, src1, src2
    operands: $binary_float_scalar

    variants:
      - name: add_float_f32
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - rn
              - rz
              - value: rm
                availability:
                  ptx: "1.0"
                  sm: 20
              - value: rp
                availability:
                  ptx: "1.0"
                  sm: 20

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: optional
            default: false
            token: .sat

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
        rule: floating_point.add

        examples:
          - ptx: "add.f32 d, a, b;"
            valid: true
          - ptx: "add.rz.ftz.sat.f32 d, a, b;"
            valid: true

      - name: add_float_f32x2
        operands: $binary_float_register
        availability:
          ptx: "8.6"
          sm: 100
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: ftz
            kind: flag
            presence: optional
            default: false
            token: .ftz

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32x2
        rule: floating_point.add

        examples:
          - ptx: "add.f32x2 d, a, b;"
            valid: true
          - ptx: "add.rp.ftz.f32x2 d, a, b;"
            valid: true

      - name: add_float_f64
        availability:
          ptx: "1.0"
          sm: 13
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: optional
            default: rn
            values:
              - $rounding_modes

          - name: ftz
            kind: flag
            presence: absent

          - name: sat
            kind: flag
            presence: absent

          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f64
        rule: floating_point.add

        examples:
          - ptx: "add.f64 d, a, b;"
            valid: true
          - ptx: "add.rm.f64 d, a, b;"
            valid: true

  - opcode: add
    section: "9.7.4.1"
    doc: "Half-precision and bfloat add."
    syntax: "add{.rn}{.ftz}{.sat}.{f16|f16x2|bf16|bf16x2} dst, src1, src2"
    variants:
      - name: add_half
