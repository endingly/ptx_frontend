# PTX comparison and selection instructions.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: comparison_and_selection
codegen_category: comparison_and_selection
section: "9.7.6"

operand_patterns:
  set_scalar:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(dtype)"}}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(stype)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(stype)"}}

  set_scalar_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(dtype)"}}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(stype)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(stype)"}}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_half_result_scalar:
    - {name: dst, kind: reg, role: dst, access: write, type: f16, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(stype)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(stype)"}}

  set_half_result_scalar_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: f16, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(stype)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(stype)"}}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_half_result_f16:
    - {name: dst, kind: reg, role: dst, access: write, type: f16, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f16, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16, register_width: same_width}

  set_half_result_f16_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: f16, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f16, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16, register_width: same_width}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_bfloat_result_scalar:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: exact}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(stype)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(stype)"}}

  set_bfloat_result_scalar_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: exact}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(stype)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(stype)"}}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_bfloat_result_f16:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: f16, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16, register_width: same_width}

  set_bfloat_result_f16_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: f16, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16, register_width: same_width}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_integer_result_f16:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(dtype)"}, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f16, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16, register_width: same_width}

  set_integer_result_f16_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(dtype)"}, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f16, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16, register_width: same_width}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_integer_result_bf16:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(dtype)"}, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}

  set_integer_result_bf16_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(dtype)"}, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_native_f16x2:
    - {name: dst, kind: reg, role: dst, access: write, type: f16x2, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f16x2, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16x2, register_width: same_width}

  set_native_f16x2_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: f16x2, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f16x2, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16x2, register_width: same_width}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_integer_result_f16x2:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f16x2, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16x2, register_width: same_width}

  set_integer_result_f16x2_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: f16x2, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: f16x2, register_width: same_width}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_bfloat_result_bf16x2:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}

  set_bfloat_result_bf16x2_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: exact}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  set_integer_result_bf16x2:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}

  set_integer_result_bf16x2_boolean:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_scalar_single:
    - {name: dst, kind: pred_or_sink, role: dst, access: write, type: pred}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}

  setp_scalar_pair:
    - {name: dst, kind: pred_pair_or_sink, role: dst, access: write, type: pred}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}

  setp_scalar_single_boolean:
    - {name: dst, kind: pred_or_sink, role: dst, access: write, type: pred}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_scalar_pair_boolean:
    - {name: dst, kind: pred_pair_or_sink, role: dst, access: write, type: pred}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_f16_single:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: f16}
    - {name: src2, kind: reg, role: src2, access: read, type: f16}

  setp_f16_single_boolean:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: f16}
    - {name: src2, kind: reg, role: src2, access: read, type: f16}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_packed_pair:
    - {name: dst, kind: pred_pair, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}

  setp_packed_pair_boolean:
    - {name: dst, kind: pred_pair, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: b32, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b32, register_width: exact}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}

  setp_bf16_single:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}

  setp_bf16_single_boolean:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    - {name: src1, kind: reg, role: src1, access: read, type: b16, register_width: exact}
    - {name: src2, kind: reg, role: src2, access: read, type: b16, register_width: exact}
    - {name: combine, kind: pred_source, role: predicate, access: read, type: pred}
  selp_u32:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
    - name: src_true
      kind: reg_or_imm
      role: src1
      access: read
      type: u32
    - name: src_false
      kind: reg_or_imm
      role: src2
      access: read
      type: u32
    - name: predicate
      kind: pred_source
      role: predicate
      access: read
      type: pred

  selp_scalar:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(type)"}}
    - {name: src_true, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(type)"}}
    - {name: src_false, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(type)"}}
    - {name: predicate, kind: pred_source, role: predicate, access: read, type: pred}

  slct_scalar:
    - {name: dst, kind: reg, role: dst, access: write, type: {expr: "modifier(dtype)"}, register_width: same_width}
    - {name: src_true, kind: reg_or_imm, role: src1, access: read, type: {expr: "modifier(dtype)"}, register_width: same_width}
    - {name: src_false, kind: reg_or_imm, role: src2, access: read, type: {expr: "modifier(dtype)"}, register_width: same_width}
    - {name: selector, kind: reg_or_imm, role: src3, access: read, type: {expr: "modifier(stype)"}, register_width: same_width}

instructions:
  - opcode: set
    section: "9.7.6.1"
    doc: "Ordinary scalar comparisons with typed result, source, Boolean, and FTZ controls."
    syntax: "set.CmpOp{.BoolOp}{.ftz}.dtype.stype dst, src1, src2{, combine}"
    variants:
      - name: set_bit
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [b16, b32, b64]}
        operands: $set_scalar
      - name: set_bit_boolean
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [b16, b32, b64]}
        operands: $set_scalar_boolean
      - name: set_signed
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [s16, s32, s64]}
        operands: $set_scalar
      - name: set_signed_boolean
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [s16, s32, s64]}
        operands: $set_scalar_boolean
        examples:
          - ptx: "set.lt.and.f32.s32 %f0, %s0, -1, !%p0;"
            valid: true
      - name: set_unsigned
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, lo, ls, hi, hs]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [u16, u32, u64]}
        operands: $set_scalar
        examples:
          - ptx: "set.eq.u32.u32 %r0, %r1, 16;"
            valid: true
      - name: set_unsigned_boolean
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, lo, ls, hi, hs]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [u16, u32, u64]}
        operands: $set_scalar_boolean
      - name: set_float
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: optional, default: false, token: .ftz}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: fixed, value: f32}
        operands: $set_scalar
      - name: set_float_boolean
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: optional, default: false, token: .ftz}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: fixed, value: f32}
        operands: $set_scalar_boolean
      - name: set_float_f64
        availability: {ptx: "1.0", sm: 13}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: fixed, value: f64}
        operands: $set_scalar
      - name: set_float_f64_boolean
        availability: {ptx: "1.0", sm: 13}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: required, values: [u32, s32, f32]}
          - {name: stype, kind: type, domain: scalar_types, presence: fixed, value: f64}
        operands: $set_scalar_boolean
  - opcode: set
    section: "9.7.7.1"
    doc: "PTX 9.3 half and bfloat SET comparisons with typed result, source, Boolean, FTZ, and target contracts."
    syntax: "set.CmpOp{.BoolOp}{.ftz}.dtype.stype dst, src1, src2{, combine}"
    variants:
      - name: set_half_f16_bit
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: fixed, value: f16}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [b16, b32, b64]}
        operands: $set_half_result_scalar
      - name: set_half_f16_bit_boolean
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: fixed, value: f16}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [b16, b32, b64]}
        operands: $set_half_result_scalar_boolean
      - name: set_half_f16_integer
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: absent}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: fixed, value: f16}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [u16, u32, u64, s16, s32, s64]}
        operands: $set_half_result_scalar
      - name: set_half_f16_integer_boolean
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge]}
          - {name: boolean, kind: boolean_op, domain: boolean_operators, presence: required, values: [and, or, xor]}
          - {name: ftz, kind: flag, presence: absent}
          - {name: dtype, kind: type, domain: scalar_types, presence: fixed, value: f16}
          - {name: stype, kind: type, domain: scalar_types, presence: required, values: [u16, u32, u64, s16, s32, s64]}
        operands: $set_half_result_scalar_boolean
      - name: set_half_f16_f16
        availability: {ptx: "4.2", sm: 53}
        modifiers:
          - {name: comparison, kind: comparison, domain: comparison_operators, presence: required, values: [eq, ne, lt, le, gt, ge, equ, neu, ltu, leu, gtu, geu, num, nan]}
