  - opcode: selp
    section: "9.7.6.3"
    doc: "Select between two same-typed ordinary scalar values using one predicate."
    syntax: "selp.type dst, src_true, src_false, predicate"
    operands: $selp_u32
    variants:
      - name: selp_u32
        description: "32-bit unsigned predicate selection."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        examples:
          - ptx: "selp.u32 %r0, %r1, 0, %p0;"
            valid: true
      - name: selp_scalar
        description: "Predicate selection for the remaining ordinary scalar types."
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values: [b16, b32, b64, u16, u64, s16, s32, s64, f32, {value: f64, availability: {sm: 13}}]
        operands: $selp_scalar
        examples:
          - ptx: "selp.s32 %r0, %r1, -1, %p0;"
            valid: true
  - opcode: slct
    section: "9.7.6.4"
