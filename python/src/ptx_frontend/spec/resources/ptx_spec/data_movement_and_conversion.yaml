instructions:
  - opcode: isspacep
    section: "9.7.9.20"
    doc: "Test whether a 32-bit or 64-bit generic register address belongs to a state-space window."
    syntax: "isspacep.{const|global|local|shared{::cta|::cluster}|param{::entry}} dst, src"
    operands: $isspacep_generic_address
    variants:
      - name: isspacep_global_u64
        description: "Register-only global address-space predicate test with a 32-bit or 64-bit source."
        availability: {ptx: "2.0", sm: 20}
        modifiers:
          - {name: state_space, kind: state_space, domain: memory_state_spaces, presence: fixed, value: global}
        examples:
          - {ptx: "isspacep.global %p0, %rd0;", valid: true}
          - {ptx: "isspacep.global %p0, %r0;", valid: true}
      - name: isspacep_const
        description: "Register-only constant address-space predicate test."
        availability: {ptx: "3.1", sm: 20}
        modifiers:
          - {name: state_space, kind: state_space, domain: memory_state_spaces, presence: fixed, value: const}
        examples:
          - {ptx: "isspacep.const %p0, %rd0;", valid: true}
      - name: isspacep_local
        description: "Register-only local address-space predicate test."
        availability: {ptx: "2.0", sm: 20}
        modifiers:
          - {name: state_space, kind: state_space, domain: memory_state_spaces, presence: fixed, value: local}
        examples:
          - {ptx: "isspacep.local %p0, %rd0;", valid: true}
      - name: isspacep_shared
        description: "Register-only shared CTA address-space predicate test using the default CTA sub-qualifier."
        availability: {ptx: "2.0", sm: 20}
        modifiers:
          - {name: state_space, kind: state_space, domain: memory_state_spaces, presence: fixed, value: shared}
        examples:
          - {ptx: "isspacep.shared %p0, %rd0;", valid: true}
      - name: isspacep_shared_cta
        description: "Register-only shared CTA address-space predicate test."
        availability: {ptx: "7.8", sm: 30}
        modifiers:
          - {name: shared_cta, kind: flag, presence: fixed, value: true, token: ".shared::cta"}
        examples:
          - {ptx: "isspacep.shared::cta %p0, %rd0;", valid: true}
      - name: isspacep_shared_cluster
        description: "Register-only shared cluster address-space predicate test."
        availability: {ptx: "7.8", sm: 90}
        modifiers:
          - {name: shared_cluster, kind: flag, presence: fixed, value: true, token: ".shared::cluster"}
        examples:
          - {ptx: "isspacep.shared::cluster %p0, %rd0;", valid: true}
      - name: isspacep_param
        description: "Register-only parameter entry address-space predicate test using the default entry sub-qualifier."
        availability: {ptx: "7.7", sm: 70}
        modifiers:
          - {name: state_space, kind: state_space, domain: memory_state_spaces, presence: fixed, value: param}
        examples:
          - {ptx: "isspacep.param %p0, %rd0;", valid: true}
      - name: isspacep_param_entry
        description: "Register-only parameter entry address-space predicate test."
        availability: {ptx: "8.3", sm: 70}
        modifiers:
          - {name: state_space, kind: state_space, domain: memory_state_spaces, presence: fixed, value: param::entry}
        examples:
          - {ptx: "isspacep.param::entry %p0, %rd0;", valid: true}

  - opcode: cvta
    section: "9.7.9.21"
    doc: "Convert state-space addresses to generic addresses, or generic registers to state-space addresses."
    syntax: "cvta{.to}.{global|local|shared{::cta|::cluster}|const|param{::entry}}.{u32|u64} dst, src"
    operands: $cvta_address
    variants:
      # Preserve these existing public variant names while adding the remaining
      # PTX 9.3 unqualified state-space conversion forms below.
      - name: cvta_global_u64
        description: "Global-to-generic u64 address conversion."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: to
            kind: flag
            presence: absent
            token: ".to"
          - name: state_space
            kind: state_space
            domain: memory_state_spaces
            presence: fixed
            value: global
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u64
        examples:
          - ptx: "cvta.global.u64 %rd0, %rd1;"
            valid: true
      - name: cvta_to_global_u64
        description: "Register-only generic-to-global u64 address conversion."
        operands: $cvta_register
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: to
            kind: flag
            presence: fixed
            value: true
            token: ".to"
          - name: state_space
            kind: state_space
            domain: memory_state_spaces
            presence: fixed
            value: global
          - name: type
