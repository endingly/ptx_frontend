  - opcode: cvt
    section: "9.7.9.22"
    doc: "Convert integer, floating-point, and packed conversion forms."
    syntax: "cvt.s32.u32 dst, src | cvt.rn.f32.f64 dst, src | cvt.rn.f32.u32 dst, src | cvt.rn.f32.s32 dst, src | cvt.rzi.u32.f32 dst, src | cvt.rn.f16x2.f32 dst, src1, src2"
    operands: $cvt_scalar
    variants:
      - name: cvt_s32_u32
        description: "Unsigned 32-bit to signed 32-bit conversion."
        rule: data_movement.cvt
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - {name: ftz, kind: flag, presence: absent, token: ".ftz"}
          - {name: sat, kind: flag, presence: optional, default: false, token: ".sat"}
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: s32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        examples:
          - ptx: "cvt.s32.u32 %s0, %r0;"
            valid: true
      - name: cvt_rn_f32_f64
        description: "Round-to-nearest f64 to f32 conversion."
        rule: data_movement.cvt
        availability:
          ptx: "1.0"
          sm: 13
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rn
          - {name: ftz, kind: flag, presence: optional, default: false, token: ".ftz"}
          - {name: sat, kind: flag, presence: optional, default: false, token: ".sat"}
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f64
        examples:
          - ptx: "cvt.rn.f32.f64 %f0, %fd0;"
            valid: true
      - name: cvt_rn_f32_u32
        description: "Round-to-nearest u32 to f32 conversion."
        rule: data_movement.cvt
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: rounding
            kind: rounding
            domain: rounding_modes
            presence: fixed
            value: rn
          - {name: ftz, kind: flag, presence: optional, default: false, token: ".ftz"}
          - {name: sat, kind: flag, presence: optional, default: false, token: ".sat"}
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: f32
          - name: src_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        examples:
          - ptx: "cvt.rn.f32.u32 %f0, %r0;"
            valid: true
      - name: cvt_rn_f32_s32
        description: "Round-to-nearest signed 32-bit to f32 conversion."
        operands: $cvt_rn_f32_s32
        rule: data_movement.cvt
        availability: {ptx: "1.0", sm: 0}
        modifiers:
          - {name: rounding, kind: rounding, domain: rounding_modes, presence: fixed, value: rn}
          - {name: ftz, kind: flag, presence: optional, default: false, token: ".ftz"}
          - {name: sat, kind: flag, presence: optional, default: false, token: ".sat"}
          - {name: dst_type, kind: type, domain: scalar_types, presence: fixed, value: f32}
          - {name: src_type, kind: type, domain: scalar_types, presence: fixed, value: s32}
        examples:
