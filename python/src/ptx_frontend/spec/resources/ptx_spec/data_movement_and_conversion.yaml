  - opcode: cvt
    section: "9.7.9.23"
    doc: "Pack two saturated s32 values into u16/s16 or sub-word integer lanes."
    syntax: "cvt.pack.sat.{u16|s16}.s32 dst, src1, src2 | cvt.pack.sat.{u2|s2|u4|s4|u8|s8}.s32.b32 dst, src1, src2, carry"
    variants:
      - name: cvt_pack_sat_u8_s32_b32
        operands: $cvt_pack_sat_u8_s32_b32
        description: "Register-only saturated packed u8 conversion."
        availability: {ptx: "6.5", sm: 72}
        modifiers:
          - {name: pack, kind: flag, presence: fixed, value: true, token: ".pack"}
          - {name: sat, kind: flag, presence: fixed, value: true, token: ".sat"}
          - {name: dst_type, kind: type, domain: scalar_types, presence: fixed, value: u8}
          - {name: src_type, kind: type, domain: scalar_types, presence: fixed, value: s32}
          - {name: carry_type, kind: type, domain: scalar_types, presence: fixed, value: b32}
        examples:
          - {ptx: "cvt.pack.sat.u8.s32.b32 %r0, %r1, %r2, %r3;", valid: true}
          - {ptx: "cvt.pack.sat.u8.s32.b32 %r0, %r1, %r2, 0;", valid: true}
      - name: cvt_pack_sat_16_s32
        operands: $cvt_pack_sat_16_s32
        description: "Saturated packed u16 or s16 conversion without a carry input."
        availability: {ptx: "6.5", sm: 72}
        modifiers:
          - {name: pack, kind: flag, presence: fixed, value: true, token: ".pack"}
          - {name: sat, kind: flag, presence: fixed, value: true, token: ".sat"}
          - {name: dst_type, kind: type, domain: scalar_types, presence: required, values: [u16, s16]}
          - {name: src_type, kind: type, domain: scalar_types, presence: fixed, value: s32}
        examples:
          - {ptx: "cvt.pack.sat.u16.s32 %r0, %r1, %r2;", valid: true}
          - {ptx: "cvt.pack.sat.s16.s32 %r0, %r1, %r2;", valid: true}
      - name: cvt_pack_sat_small_s32_b32
        operands: $cvt_pack_sat_small_s32_b32
        description: "Saturated packed s8 or sub-byte conversion with a b32 carry container."
        availability: {ptx: "6.5", sm: 72}
        modifiers:
          - {name: pack, kind: flag, presence: fixed, value: true, token: ".pack"}
          - {name: sat, kind: flag, presence: fixed, value: true, token: ".sat"}
          - name: dst_type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - s8
              - {value: u4, availability: {ptx: "6.5", sm: 75}}
              - {value: s4, availability: {ptx: "6.5", sm: 75}}
              - {value: u2, availability: {ptx: "6.5", sm: 75}}
              - {value: s2, availability: {ptx: "6.5", sm: 75}}
          - {name: src_type, kind: type, domain: scalar_types, presence: fixed, value: s32}
          - {name: carry_type, kind: type, domain: scalar_types, presence: fixed, value: b32}
        examples:
          - {ptx: "cvt.pack.sat.s8.s32.b32 %r0, %r1, %r2, 0;", valid: true}
          - {ptx: "cvt.pack.sat.u4.s32.b32 %r0, %r1, %r2, %r3;", valid: true}

  - opcode: mov
    section: "9.7.9"
    doc: >
      Move a scalar register, immediate, or compatible special register into
      a 16/32/64-bit register. Integer/bit-size 32/64-bit forms also accept a data-variable
      or formal-parameter address, with an optional constant byte offset, or a
      bare device/kernel function address. Predicate register moves are also
      supported. Bit-size forms pack or unpack two/four scalar register elements;
      .b128 is available only for these vector forms (9.7.9.4).
    syntax: "mov{.v4.u32|.pred|.b16|.u16|.s16|.b32|.u32|.s32|.f32|.b64|.u64|.s64|.f64|.b128} dst, src"

    variants:
      - name: mov_scalar
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values:
              - b16
              - u16
              - s16
              - b32
              - u32
              - s32
              - f32
              - b64
              - u64
              - s64
              - value: f64
                availability:
                  ptx: "1.0"
                  sm: 13
        operand_layouts:
          - name: scalar
            operands: $mov_scalar
          - name: pack
            operands: $mov_pack
          - name: unpack
            operands: $mov_unpack
        rule: data_movement.mov
        operand_type_compatibilities:
          - operand: src
            value_kind: special_register
            values:
              - tid
              - ntid
              - ctaid
              - nctaid
            instruction_width: 16
            effective_type: u16
            availability:
              ptx: "1.0"
              sm: 0
          - operand: src
            value_kind: special_register
            values:
              - gridid
            instruction_width: 16
            effective_type: u16
            availability:
              ptx: "1.0"
              sm: 0
          - operand: src
            value_kind: special_register
            values:
              - gridid
            instruction_width: 32
            effective_type: u32
            availability:
              ptx: "1.3"
              sm: 0

        examples:
          - ptx: "mov.u16 %h0, %h1;"
            valid: true
          - ptx: "mov.u16 %h0, %tid.x;"
            valid: true
          - ptx: "mov.u32 %r0, %laneid;"
            valid: true
          - ptx: "mov.u32 %r0, %tid.x;"
            valid: true
          - ptx: "mov.u32 %r0, %r1;"
            valid: true
          - ptx: "mov.u32 %r0, 42;"
            valid: true
          - ptx: "mov.u32 %r0, kernel_parameter;"
            valid: true
          - ptx: "mov.u32 %r0, device_function;"
            valid: true
          - ptx: "mov.b32 %r0, %laneid;"
            valid: true
          - ptx: "mov.b32 %r0, {%h0, %h1};"
            valid: true
          - ptx: "mov.b64 {%r0, _}, %rd0;"
            valid: true
          - ptx: "mov.f32 %f0, 0f3f800000;"
            valid: true
          - ptx: "mov.u64 %rd0, global_value;"
            valid: true
          - ptx: "mov.u64 %rd0, global_value+8;"
            valid: true
          - ptx: "mov.u64 %rd0, %rd1;"
            valid: true
          - ptx: "mov.u64 %rd0, 0;"
            valid: true
          - ptx: "mov.u64 %rd0, kernel_function;"
            valid: true
          - ptx: "mov.f64 %fd0, 0d3ff0000000000000;"
            valid: true

      - name: mov_b128_pack_unpack
        availability:
          ptx: "8.3"
          sm: 70
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: b128
        operand_layouts:
          - name: pack
            operands: $mov_pack
          - name: unpack
            operands: $mov_unpack
        rule: data_movement.mov
        examples:
          - ptx: "mov.b128 %b0, {%rd0, %rd1};"
            valid: true

      - name: mov_v4_u32
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: vector
            kind: vector
            domain: vector_arities
            presence: required
            values: [v4]
          - name: type
            kind: type
            domain: scalar_types
            presence: required
            values: [u32]
        operands: $mov_v4_u32
        rule: data_movement.mov
        examples:
          - ptx: "mov.v4.u32 %r0, %clusterid;"
            valid: false

      - name: mov_pred
        availability:
          ptx: "1.0"
          sm: 0
        modifiers:
          - name: type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operands: $mov_pred
        rule: data_movement.mov

        examples:
          - ptx: "mov.pred %p0, %p1;"
            valid: true

  - opcode: mapa
    section: "9.7.9.24"
    doc: >
      Map a shared or generic shared address to a cluster CTA rank. The frontend
      validates local forms and target availability only; it does not model
      cluster address validity or runtime mapping behavior.
    syntax: "mapa{.shared::cluster}.{u32|u64} d, a, b"

    variants:
      - name: mapa_shared_cluster
        availability:
          any_of:
            - {ptx: "7.8", sm: 90, capabilities: [cluster]}
        modifiers:
          - {name: shared_cluster, kind: flag, presence: fixed, value: true, token: ".shared::cluster"}
          - {name: type, kind: type, domain: scalar_types, presence: required, values: [u32, u64]}
        operands: $mapa_shared_cluster

      - name: mapa_generic
        availability:
          any_of:
            - {ptx: "7.8", sm: 90, capabilities: [cluster]}
        modifiers:
          - {name: type, kind: type, domain: scalar_types, presence: required, values: [u32, u64]}
        operands: $mapa_generic

  - opcode: getctarank
    section: "9.7.9.25"
    doc: >
      Query the CTA rank for a shared or generic shared address. The frontend
      validates local forms and target availability only; it does not model
      cluster address validity or runtime rank behavior.
    syntax: "getctarank{.shared::cluster}.{u32|u64} d, a"

    variants:
      - name: getctarank_shared_cluster
        availability:
          any_of:
            - {ptx: "7.8", sm: 90, capabilities: [cluster]}
