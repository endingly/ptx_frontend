# PTX data movement and conversion instructions.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: data_movement_and_conversion
codegen_category: data_movement
section: "9.7.9"

type_sets:
  ld_st_scalar_types:
    - b8
    - b16
    - b32
    - b64
    - u8
    - u16
    - u32
    - u64
    - s8
    - s16
    - s32
    - s64
    - f32

  ldu_v4_types: [b8, b16, b32, u8, u16, u32, s8, s16, s32, f32]

  cvt_base_scalar_types: [u8, u16, u32, u64, s8, s16, s32, s64, f16, f32, f64]
  cvt_base_scalar_without_s32: [u8, u16, u32, u64, s8, s16, s64, f16, f32, f64]
  cvt_base_scalar_without_u32: [u8, u16, u64, s8, s16, s32, s64, f16, f32, f64]
  cvt_base_scalar_without_f32: [u8, u16, u32, u64, s8, s16, s32, s64, f16, f64]
  cvt_base_scalar_without_f16: [u8, u16, u32, u64, s8, s16, s32, s64, f32, f64]
  cvt_base_scalar_without_f16_f32: [u8, u16, u32, u64, s8, s16, s32, s64, f64]
  cvt_base_scalar_without_f32_f64_u32_s32: [u8, u16, u64, s8, s16, s64, f16]

value_sets:
  ld_cache_operators: [ca, cg, cs, lu, cv]
  ld_nc_cache_operators: [ca, cg, cs]
  st_cache_operators: [wb, cg, cs, wt]

operand_patterns:
  mov_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: mov_scalar_src
      role: src
      access: read
      type:
        expr: modifier(type)

  mapa_shared_cluster:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: same_width
    - name: src
      kind: cluster_address
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: same_width
      state_space: [shared]
    - name: rank
      kind: reg_or_imm
      role: src
      access: read
      type: u32
      register_width: same_width
      immediate_conversion: require_target_range

  mapa_generic:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: same_width
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: same_width
    - name: rank
      kind: reg_or_imm
      role: src
      access: read
      type: u32
      register_width: same_width
      immediate_conversion: require_target_range

  getctarank_shared_cluster:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
      register_width: same_width
    - name: src
      kind: cluster_address
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: same_width
      state_space: [shared]

  getctarank_generic:
    - name: dst
      kind: reg
      role: dst
      access: write
      type: u32
      register_width: same_width
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
      register_width: same_width

  mov_pred:
    - name: dst
      kind: pred
      role: dst
      access: write
      type: pred
    - name: src
      kind: pred_or_sreg
      role: src
      access: read
      type: pred

  mov_v4_u32:
    - name: dst
      kind: vector_reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
    - name: src
      kind: vector_sreg
      role: src
      access: read
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element

  cvt_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(dst_type)
      register_width: equal_or_wider
    - name: src
      kind: reg_or_imm
      role: src
      access: read
      type:
        expr: modifier(src_type)
      register_width: equal_or_wider

  cvt_rn_f32_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: f32, register_width: equal_or_wider}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: s32, register_width: equal_or_wider}

  cvt_rn_f16x2_f32:
    - {name: dst, kind: reg, role: dst, access: write, type: f16x2, register_width: equal_or_wider}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: f32, register_width: equal_or_wider}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: f32, register_width: equal_or_wider}

  cvt_b16_f32:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: equal_or_wider}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: f32, register_width: equal_or_wider}

  cvt_f16_f32:
    - {name: dst, kind: reg, role: dst, access: write, type: f16, register_width: equal_or_wider}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: f32, register_width: equal_or_wider}

  cvt_b32_f32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: equal_or_wider}
    - {name: src, kind: reg_or_imm, role: src, access: read, type: f32, register_width: equal_or_wider}

  cvt_b32_f32_pair:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: equal_or_wider}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: f32, register_width: equal_or_wider}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: f32, register_width: equal_or_wider}

  cvt_b32_f32_quad_rbits:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: equal_or_wider}
    - name: src
      kind: reg_vector
      role: src
      access: read
      type: f32
      register_width: equal_or_wider
      vector: {kind: vector, arity: [4], type_policy: element}
    - {name: rbits, kind: reg, role: src2, access: read, type: b32, register_width: same_width}

  cvt_b16_f32_quad_rbits:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: equal_or_wider}
    - name: src
      kind: reg_vector
      role: src
      access: read
      type: f32
      register_width: equal_or_wider
      vector: {kind: vector, arity: [4], type_policy: element}
    - {name: rbits, kind: reg, role: src2, access: read, type: b32, register_width: same_width}

  cvt_b16_packed:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: equal_or_wider}

  cvt_b8_packed:
    - {name: dst, kind: reg, role: dst, access: write, type: b8, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: equal_or_wider}

  cvt_b8_packed_bf16x2:
    - {name: dst, kind: reg, role: dst, access: write, type: b8, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: same_width}

  cvt_b16_packed_bf16x2:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: same_width}

  cvt_b32_packed:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b16, register_width: equal_or_wider}

  cvt_b32_b8_packed:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b8, register_width: equal_or_wider}

  cvt_b8_f32_pair:
    - {name: dst, kind: reg, role: dst, access: write, type: b8, register_width: equal_or_wider}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: f32, register_width: equal_or_wider}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: f32, register_width: equal_or_wider}

  cvt_b16_f32_pair:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: equal_or_wider}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: f32, register_width: equal_or_wider}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: f32, register_width: equal_or_wider}

  cvt_b16_packed_optional_scale:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b32, register_width: equal_or_wider}
    - {name: scale_factor, kind: reg, role: src2, access: read, type: b16, register_width: same_width}

  cvt_b32_packed_optional_scale:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b16, register_width: equal_or_wider}
    - {name: scale_factor, kind: reg, role: src2, access: read, type: b16, register_width: same_width}

  cvt_b32_b8_packed_optional_scale:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: equal_or_wider}
    - {name: src, kind: reg, role: src, access: read, type: b8, register_width: equal_or_wider}
    - {name: scale_factor, kind: reg, role: src2, access: read, type: b16, register_width: same_width}

  cvt_b16_f32_pair_optional_scale:
    - {name: dst, kind: reg, role: dst, access: write, type: b16, register_width: equal_or_wider}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: f32, register_width: equal_or_wider}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: f32, register_width: equal_or_wider}
    - {name: scale_factor, kind: reg, role: src3, access: read, type: b16, register_width: same_width}

  cvt_pack_sat_u8_s32_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: s32, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: s32, register_width: same_width}
    - {name: carry, kind: reg_or_imm, role: src3, access: read, type: b32, register_width: same_width}

  cvt_pack_sat_16_s32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: s32, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: s32, register_width: same_width}

  cvt_pack_sat_small_s32_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: u32, register_width: same_width}
    - {name: src1, kind: reg, role: src1, access: read, type: s32, register_width: same_width}
    - {name: src2, kind: reg, role: src2, access: read, type: s32, register_width: same_width}
    - {name: carry, kind: reg_or_imm, role: src3, access: read, type: b32, register_width: same_width}

  cvta_register:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)

  cvta_address:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: cluster_address
      role: src
      access: read
      type:
        expr: modifier(type)
      state_space:
        expr: modifier(state_space)

  cvta_param_address:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: cluster_address
      role: src
      access: read
      type:
        expr: modifier(type)
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: input
        function_availability: {ptx: "2.0", sm: 20}

  prmt_generic_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: b32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: b32, register_width: same_width}
    - {name: selector, kind: reg_or_imm, role: src3, access: read, type: b32, register_width: same_width}

  prmt_f4e_b32:
    - {name: dst, kind: reg, role: dst, access: write, type: b32, register_width: same_width}
    - {name: src1, kind: reg_or_imm, role: src1, access: read, type: b32, register_width: same_width}
    - {name: src2, kind: reg_or_imm, role: src2, access: read, type: b32, register_width: same_width}
    - {name: selector, kind: reg_or_imm, role: src3, access: read, type: b32, register_width: same_width}

  mov_pack:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
    - name: src
      kind: reg_vector
      role: src
      access: read
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity: [2, 4]

  mov_unpack:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      vector:
        kind: vector
        arity: [2, 4]
        allow_sink: true
    - name: src
      kind: reg
      role: src
      access: read
      type:
        expr: modifier(type)
  ld_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        - value: const
          availability:
            ptx: "3.1"
        - global
        - local
        - shared

  ld_explicit_scalar:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: input
        function_availability:
          ptx: "2.0"
          sm: 20

  ld_explicit_scalar_cache_policy:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  ld_scalar_cache_policy:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      # Cache-policy loads permit unresolved generic registers, but a known
      # provenance must be global.
      state_space: [global]
    - name: cache_policy
      kind: reg
      role: src
      access: read
      type: b64

  ld_explicit_scalar_global:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)

  ld_scalar_global:
    - name: dst
      kind: reg
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
    - name: address
      kind: addr
      role: addr
      access: read
      # This is a generic spelling; unknown register provenance remains valid.
      state_space: [global]

  prefetch_global:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)

  prefetch_generic:
    - name: address
      kind: addr
      role: addr
      access: read
      # A generic prefetch may address global or local data; shared is a no-op.
      state_space: [global, local, shared]

  prefetch_generic_tensormap:
    - name: address
      kind: addr
      role: addr
      access: read
      # A direct generic tensor-map symbol is global; unknown registers retain
      # their runtime provenance without claiming a cache effect.
      state_space: [global]

  prefetch_param_tensormap:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: input
        function_availability: {ptx: "2.0", sm: 20}

  prefetchu_generic:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [generic]

  createpolicy_fractional_with_fraction:
    - &createpolicy_dst
      name: dst
      kind: reg
      role: dst
      access: write
      type: b64
    - name: fraction
      kind: reg_or_imm
      role: src
      access: read
      type: f32
      register_width: same_width

  createpolicy_fractional_default:
    - *createpolicy_dst

  createpolicy_range_generic:
    - *createpolicy_dst
    - name: address
      kind: addr
      role: addr
      access: read
      # A known non-global address violates the generic form's PTX precondition.
      state_space: [global]
    - &createpolicy_primary_size
      name: primary_size
      kind: reg_or_imm
      role: src
      access: read
      type: u32
      register_width: same_width
      immediate_conversion: require_target_range
    - &createpolicy_total_size
      name: total_size
      kind: reg_or_imm
      role: src
      access: read
      type: u32
      register_width: same_width
      immediate_conversion: require_target_range

  createpolicy_range_global:
    - *createpolicy_dst
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - *createpolicy_primary_size
    - *createpolicy_total_size

  createpolicy_cvt:
    - *createpolicy_dst
    - name: access_property
      kind: reg
      role: src
      access: read
      type: b64
      register_width: same_width

  applypriority_global_l2_evict_normal:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
    - name: size
      kind: imm
      role: src
      access: read
      type: u32

  applypriority_generic_l2_evict_normal:
    - name: address
      kind: addr
      role: addr
      access: read
      # Generic syntax requires a global address at runtime. Unknown register
      # provenance remains valid; known non-global symbols are rejected.
      state_space: [global]
    - name: size
      kind: imm
      role: src
      access: read
      type: u32

  cp_async_shared_global:
    - name: dst
      kind: addr
      role: addr
      access: write
      state_space: [shared]
    - name: src
      kind: addr
      role: addr
      access: read
      state_space: [global]
    - name: cp_size
      kind: imm
      role: src
      access: read
      type: u32

  cp_async_mbarrier_arrive_address:
    - name: address
      kind: addr
      role: addr
      access: read
      state_space: [shared]

  isspacep_generic_address:
    - {name: dst, kind: pred, role: dst, access: write, type: pred}
    # PTX deliberately omits a size suffix: the generic address source is
    # either 32 or 64 bits.  Equal-or-wider from u32 admits those fundamental
    # address containers without admitting floating or packed declarations.
    - {name: src, kind: reg, role: src, access: read, type: u32, register_width: equal_or_wider}

  shfl_sync_idx:
    - name: dst
      kind: shfl_dest
      role: dst
      access: write
      type: b32
    - name: src
      kind: reg
      role: src
      access: read
      type: b32
    - name: lane
      kind: reg_or_imm
      role: src
      access: read
      type: u32
    - name: clamp
      kind: reg_or_imm
      role: src
      access: read
      type: u32
    - name: membermask
      kind: reg_or_imm
      role: src
      access: read
      type: u32

  ld_vector:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        - value: const
          availability:
            ptx: "3.1"
        - global
        - local
        - shared

  ld_explicit_vector:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)
      parameter:
        direction: input
        function_availability:
          ptx: "2.0"
          sm: 20

  ld_explicit_vector_global:
    - name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
          expr: modifier(vector)
        type_policy: element
        allow_sink: true
        sink_payload_bits: 256
    - name: address
      kind: addr
      role: addr
      access: read
      state_space:
        expr: modifier(state_space)

  ldu_vector_global:
    - &ldu_vector_dst
      name: dst
      kind: reg_vector
      role: dst
      access: write
      type:
        expr: modifier(type)
      register_width: equal_or_wider
      vector:
        kind: vector
        arity:
