# PTX miscellaneous instructions.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml

schema: ptx-instr/v1
ptx_isa: "9.3"
category: miscellaneous
codegen_category: control_flow
section: "9.7.20"

instructions:
  - opcode: brkpt
    section: "9.7.20.1"
    doc: "Suspend the current thread at a breakpoint."
    syntax: "brkpt"

    variants:
      - name: brkpt_bare
        description: "Breakpoint with no modifiers or operands."
        availability: {ptx: "1.0", sm: 11}
        modifiers: []
        operands: []
        examples:
          - {ptx: "brkpt;", valid: true}
          - {ptx: "@%p0 brkpt;", valid: true}

  - opcode: nanosleep
    section: "9.7.20.2"
    doc: "Suspend the thread for an approximate duration in nanoseconds."
    syntax: "nanosleep.u32 t"

    variants:
      - name: nanosleep_u32
        description: "Sleep duration from a 32-bit register or immediate."
        availability: {ptx: "6.3", sm: 70}
        modifiers:
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: u32}
        operands:
          - {name: t, kind: reg_or_imm, role: src, access: read, type: u32, register_width: same_width}
        examples:
          - {ptx: "nanosleep.u32 42;", valid: true}

  - opcode: pmevent
    section: "9.7.20.3"
    doc: "Trigger one or more performance monitor events."
    syntax: "pmevent[.mask] a"

    variants:
      - name: pmevent_index
        description: "Trigger one event selected by its index."
        availability: {ptx: "1.4", sm: 0}
        modifiers: []
        operands:
          - {name: a, kind: imm, role: src, access: read, type: u32}
        constraints:
          - {kind: immediate_range, operand: a, minimum: 0, maximum: 15}
        examples:
          - {ptx: "pmevent 7;", valid: true}

      - name: pmevent_mask
        description: "Trigger the events selected by a 16-bit mask."
        availability: {ptx: "3.0", sm: 20}
        modifiers:
          - {name: mask, kind: flag, presence: fixed, value: true, token: .mask}
        operands:
          - {name: a, kind: imm, role: src, access: read, type: u32}
        constraints:
          - {kind: immediate_range, operand: a, minimum: 0, maximum: 65535}
        examples:
          - {ptx: "pmevent.mask 0xff;", valid: true}

  - opcode: trap
    section: "9.7.20.4"
    doc: "Trap the current thread."
    syntax: "trap"

    variants:
      - name: trap_bare
        description: "Thread trap with no modifiers or operands."
        availability:
          ptx: "1.0"
          sm: 0
        modifiers: []
        operands: []

        examples:
          - ptx: "trap;"
            valid: true
          - ptx: "@%p0 trap;"
            valid: true

  - opcode: setmaxnreg
    section: "9.7.20.5"
    doc: "Set the per-thread maximum register count."
    syntax: "setmaxnreg.action.sync.aligned.u32 count"

    variants:
      - name: setmaxnreg_inc_sync_aligned_u32
        description: "Increase the warp's per-thread maximum register count."
        availability:
          any_of:
            - {ptx: "8.0", sm: 90, target: sm_90a}
            - {ptx: "8.6", sm: 100, target: sm_100a}
            - {ptx: "8.7", sm: 120, target: sm_120a}
            - {ptx: "8.8", sm: 100, family: sm_100f}
            - {ptx: "9.0", sm: 110, family: sm_110f}
            - {ptx: "8.8", sm: 120, family: sm_120f}
        modifiers:
          - {name: inc, kind: flag, presence: fixed, value: true, token: .inc}
          - {name: sync, kind: flag, presence: fixed, value: true, token: .sync}
          - {name: aligned, kind: flag, presence: fixed, value: true, token: .aligned}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: u32}
        operands:
          - {name: count, kind: imm, role: src, access: read, type: u32}
        constraints:
          - {kind: immediate_range, operand: count, minimum: 24, maximum: 256}
          - {kind: immediate_multiple_of, operand: count, divisor: 8}
        examples:
          - ptx: "setmaxnreg.inc.sync.aligned.u32 192;"
            valid: true

      - name: setmaxnreg_dec_sync_aligned_u32
        description: "Decrease the warp's per-thread maximum register count."
        availability:
          any_of:
            - {ptx: "8.0", sm: 90, target: sm_90a}
            - {ptx: "8.6", sm: 100, target: sm_100a}
            - {ptx: "8.7", sm: 120, target: sm_120a}
            - {ptx: "8.8", sm: 100, family: sm_100f}
            - {ptx: "9.0", sm: 110, family: sm_110f}
            - {ptx: "8.8", sm: 120, family: sm_120f}
        modifiers:
          - {name: dec, kind: flag, presence: fixed, value: true, token: .dec}
          - {name: sync, kind: flag, presence: fixed, value: true, token: .sync}
          - {name: aligned, kind: flag, presence: fixed, value: true, token: .aligned}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: u32}
        operands:
          - {name: count, kind: imm, role: src, access: read, type: u32}
        constraints:
          - {kind: immediate_range, operand: count, minimum: 24, maximum: 256}
          - {kind: immediate_multiple_of, operand: count, divisor: 8}
        examples:
          - {ptx: "setmaxnreg.dec.sync.aligned.u32 64;", valid: true}
