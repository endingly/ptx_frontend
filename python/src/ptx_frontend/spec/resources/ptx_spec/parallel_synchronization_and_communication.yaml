instructions:
  - opcode: bar
    section: "9.7.14.1"
    doc: >
      CTA barrier synchronization. The barrier identifier and optional
      participating-thread count are unsigned 32-bit values.
    syntax: "bar{.cta}.{sync|arrive|red.*} operands"

    variants:
      # The register-barrier and thread-count forms were introduced together
      # in PTX ISA 2.0 and require sm_20. The older sm_1x form accepts only an
      # immediate barrier identifier.
      - name: bar_sync
        description: "bar.sync with a CTA barrier identifier and optional thread count."
        availability:
          ptx: "1.0"
          sm: 10
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: sync
            kind: flag
            presence: fixed
            value: true
            token: ".sync"
        operand_layouts:
          - name: immediate_barrier
            operands: $bar_sync_immediate_barrier
          - name: barrier
            operands: $bar_sync_barrier
            availability:
              ptx: "2.0"
              sm: 20
          - name: barrier_and_thread_count
            operands: $bar_sync_barrier_and_thread_count
            availability:
              ptx: "2.0"
              sm: 20
        constraints:
          - {kind: immediate_range, operand: barrier, minimum: 0, maximum: 15}
          - {kind: immediate_multiple_of, operand: thread_count, divisor: 32}
        rule: parallel_sync_and_communication.bar_sync

        examples:
          - ptx: "bar.sync 0;"
            valid: true
          - ptx: "bar.sync %r1, 128;"
            valid: true

      - name: bar_cta_sync
        description: "bar.cta.sync; semantically equivalent CTA-qualified spelling."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: sync
            kind: flag
            presence: fixed
            value: true
            token: ".sync"
        operand_layouts:
          - name: barrier
            operands: $bar_sync_barrier
          - name: barrier_and_thread_count
            operands: $bar_sync_barrier_and_thread_count
        constraints:
          - {kind: immediate_range, operand: barrier, minimum: 0, maximum: 15}
          - {kind: immediate_multiple_of, operand: thread_count, divisor: 32}
        rule: parallel_sync_and_communication.bar_sync

        examples:
          - ptx: "bar.cta.sync 0;"
            valid: true
          - ptx: "bar.cta.sync %r1, %r2;"
            valid: true

      - name: bar_arrive
        description: "bar.arrive with a CTA barrier identifier and thread count."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: arrive
            kind: flag
            presence: fixed
            value: true
            token: ".arrive"
        operands: $bar_sync_barrier_and_thread_count
        constraints:
          - {kind: immediate_range, operand: barrier, minimum: 0, maximum: 15}
          - {kind: immediate_range, operand: thread_count, minimum: 1}
          - {kind: immediate_multiple_of, operand: thread_count, divisor: 32}
        rule: parallel_sync_and_communication.bar_arrive

        examples:
          - ptx: "bar.arrive 0, 64;"
            valid: true

      - name: bar_cta_arrive
        description: "bar.cta.arrive; semantically equivalent CTA-qualified spelling."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: arrive
            kind: flag
            presence: fixed
            value: true
            token: ".arrive"
        operands: $bar_sync_barrier_and_thread_count
        constraints:
          - {kind: immediate_range, operand: barrier, minimum: 0, maximum: 15}
          - {kind: immediate_range, operand: thread_count, minimum: 1}
          - {kind: immediate_multiple_of, operand: thread_count, divisor: 32}
        rule: parallel_sync_and_communication.bar_arrive

        examples:
          - ptx: "bar.cta.arrive 0, %r2;"
            valid: true

      - name: bar_red_popc_u32
        description: "bar.red.popc.u32 with an optional thread count."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".popc"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_popc_without_thread_count
          - name: with_thread_count
            operands: $bar_red_popc_with_thread_count
        constraints:
          - {kind: immediate_range, operand: barrier, minimum: 0, maximum: 15}
          - {kind: immediate_multiple_of, operand: thread_count, divisor: 32}
        rule: parallel_sync_and_communication.bar_red_popc

        examples:
          - ptx: "bar.red.popc.u32 %r0, 1, %p1;"
            valid: true
          - ptx: "bar.red.popc.u32 %r0, 1, 64, !%p1;"
            valid: true

      - name: bar_cta_red_popc_u32
        description: "bar.cta.red.popc.u32 with an optional thread count."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".popc"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: u32
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_popc_without_thread_count
          - name: with_thread_count
            operands: $bar_red_popc_with_thread_count
        constraints:
          - {kind: immediate_range, operand: barrier, minimum: 0, maximum: 15}
          - {kind: immediate_multiple_of, operand: thread_count, divisor: 32}
        rule: parallel_sync_and_communication.bar_red_popc

        examples:
          - ptx: "bar.cta.red.popc.u32 %r0, 1, %p1;"
            valid: true

      - name: bar_red_and_pred
        description: "bar.red.and.pred with an optional thread count."
        availability:
          ptx: "2.0"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: absent
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".and"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operand_layouts:
          - name: without_thread_count
            operands: $bar_red_pred_without_thread_count
          - name: with_thread_count
            operands: $bar_red_pred_with_thread_count
        constraints:
          - {kind: immediate_range, operand: barrier, minimum: 0, maximum: 15}
          - {kind: immediate_multiple_of, operand: thread_count, divisor: 32}
        rule: parallel_sync_and_communication.bar_red_and

        examples:
          - ptx: "bar.red.and.pred %p0, 1, %p1;"
            valid: true

      - name: bar_cta_red_and_pred
        description: "bar.cta.red.and.pred with an optional thread count."
        availability:
          ptx: "7.8"
          sm: 20
        modifiers:
          - name: cta
            kind: flag
            presence: fixed
            value: true
            token: ".cta"

          - name: red
            kind: flag
            presence: fixed
            value: true
            token: ".red"

          - name: reduction
            kind: flag
            presence: fixed
            value: true
            token: ".and"

          - name: result_type
            kind: type
            domain: scalar_types
            presence: fixed
            value: pred
        operand_layouts:
