      mbarrier.arrive{.{release|relaxed}.{cta|cluster}}{.shared{::cta}}.b64 state, [addr]{, count} |
      mbarrier.arrive{.{release|relaxed}.{cta|cluster}}.shared::cluster.b64 _, [addr]{, count} |
      mbarrier.arrive.expect_tx{.{release|relaxed}.{cta|cluster}}{.shared{::cta}}.b64 state, [addr], txCount |
      mbarrier.arrive.expect_tx{.{release|relaxed}.{cta|cluster}}.shared::cluster.b64 _, [addr], txCount |
      mbarrier.arrive.noComplete{.release.cta}{.shared{::cta}}.b64 state, [addr], count |
      mbarrier.arrive_drop{.{release|relaxed}.{cta|cluster}}{.shared{::cta}}.b64 state, [addr]{, count} |
      mbarrier.arrive_drop{.{release|relaxed}.{cta|cluster}}.shared::cluster.b64 _, [addr]{, count} |
      mbarrier.arrive_drop.expect_tx{.{release|relaxed}.{cta|cluster}}{.shared{::cta}}.b64 state, [addr], txCount |
      mbarrier.arrive_drop.expect_tx{.{release|relaxed}.{cta|cluster}}.shared::cluster.b64 _, [addr], txCount |
      mbarrier.arrive_drop.noComplete{.release.cta}{.shared{::cta}}.b64 state, [addr], count |
      mbarrier.test_wait.phase_type::primary{.shared{::cta}}.b64 waitComplete[|reportPredicate{, reportValue}], [addr], state |
      mbarrier.test_wait.parity.phase_type::primary{.shared{::cta}}.b64 waitComplete[|reportPredicate{, reportValue}], [addr], phaseParity |
      mbarrier.test_wait.parity.phase_type::conditional{.shared{::cta}}.b64 waitComplete, [addr], phaseParity |
      mbarrier.try_wait.phase_type::primary{.shared{::cta}}.b64 waitComplete[|reportPredicate{, reportValue}], [addr], state{, timeHint} |
      mbarrier.try_wait.parity.phase_type::primary{.shared{::cta}}.b64 waitComplete[|reportPredicate{, reportValue}], [addr], phaseParity{, timeHint} |
      mbarrier.try_wait.parity.phase_type::conditional{.shared{::cta}}.b64 waitComplete, [addr], phaseParity{, timeHint} |
      mbarrier.pending_count{.layout::v0}.b64 count, state |
      mbarrier.check_layout.layout::{v0|v1}{.shared::cta}.b64 p, [addr]

