  - opcode: mbarrier
    section: "9.7.14.16.12"
    doc: >
      Initialize, invalidate, arrive at, test or try completion, query pending arrivals, or record expected or completed transaction counts for a
      shared-memory barrier object. The frontend validates local address,
      operand, alignment, and target constraints only; it does not model
      barrier lifecycle or runtime phase behavior.
