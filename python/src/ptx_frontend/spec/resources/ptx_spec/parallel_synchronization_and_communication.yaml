      mbarrier.init{.layout::{v0|v1}}{.shared{::cta}}.b64 |
      mbarrier.inval{.shared{::cta}}.b64 |
      mbarrier.expect_tx{.relaxed.{cta|cluster}}{.shared|.shared::cta|.shared::cluster}.b64 |
