            values:
              - value: layout::v0
                availability: {ptx: "9.3", sm: 90}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: b64}
        operands: $mbarrier_init
        constraints:
          - {kind: address_alignment, address_operand: address, alignment: 8}
