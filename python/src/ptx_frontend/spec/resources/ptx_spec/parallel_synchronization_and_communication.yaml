  bar_sync_immediate_barrier:
    - name: barrier
      kind: imm
      role: barrier
      access: read
      type: u32
      immediate_conversion: require_target_range

  bar_sync_barrier:
    - name: barrier
      kind: reg_or_imm
      role: barrier
      access: read
      type: u32
      immediate_conversion: require_target_range
  bar_warp_sync_membermask:
