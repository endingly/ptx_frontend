  - opcode: clusterlaunchcontrol
    section: "9.7.14.18"
    doc: >
      Starts an asynchronous cancellation attempt or queries its response. The
      frontend validates local operands and target availability only; it does
      not model response contents or runtime cancellation.
    syntax: |-
      clusterlaunchcontrol.try_cancel.async{.shared::cta}.mbarrier::complete_tx::bytes{.multicast::cluster::all}.b128 [response], [mbarrier]
      clusterlaunchcontrol.query_cancel.is_canceled.pred.b128 pred, response
      clusterlaunchcontrol.query_cancel.get_first_ctaid.v4.b32.b128 {x, y, z, _}, response
      clusterlaunchcontrol.query_cancel.get_first_ctaid::{x|y|z}.b32.b128 reg, response
    variants:
      - name: clusterlaunchcontrol_try_cancel_async_generic
        availability:
          any_of: [{ptx: "8.6", sm: 100, capabilities: [cluster]}]
        modifiers:
          - {name: try_cancel, kind: flag, presence: fixed, value: true, token: .try_cancel}
          - {name: async, kind: flag, presence: fixed, value: true, token: .async}
          - {name: mbarrier_complete_tx_bytes, kind: flag, presence: fixed, value: true, token: .mbarrier::complete_tx::bytes}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: b128}
        operands: $clusterlaunchcontrol_try_cancel
        constraints: [{kind: address_alignment, address_operand: response, alignment: 16}, {kind: address_alignment, address_operand: mbarrier, alignment: 8}]
      - name: clusterlaunchcontrol_try_cancel_async_shared_cta
        availability:
          any_of: [{ptx: "8.6", sm: 100, capabilities: [cluster]}]
        modifiers:
