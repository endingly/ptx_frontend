# PTX stack manipulation instructions.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml
schema: ptx-instr/v1
ptx_isa: '9.3'
category: stack_manipulation
codegen_category: stack_manipulation
section: 9.7.18
instructions:
- opcode: stacksave
  section: 9.7.18.1
  doc: Manipulate the current thread stack with static typed operands.
  variants:
  - name: stacksave_u32
    availability:
      ptx: '7.3'
      sm: 52
    stack:
      operation: save
      width: 32
      default_alignment: 8
    modifiers:
    - name: type
      kind: type
      domain: scalar_types
      presence: fixed
      value: u32
    operand_layouts:
    - name: scalar
      operands:
      - name: dst
        kind: stack_token
        role: dst
        access: write
        type: u32
  - name: stacksave_u64
    availability:
      ptx: '7.3'
      sm: 52
    stack:
      operation: save
      width: 64
      default_alignment: 8
    modifiers:
    - name: type
      kind: type
      domain: scalar_types
      presence: fixed
      value: u64
    operand_layouts:
    - name: scalar
      operands:
      - name: dst
        kind: stack_token
        role: dst
        access: write
        type: u64
