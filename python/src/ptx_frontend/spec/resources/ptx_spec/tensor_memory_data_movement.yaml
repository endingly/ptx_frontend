# PTX fifth-generation Tensor Memory data movement and synchronization.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml
schema: ptx-instr/v1
ptx_isa: "9.3"
category: tensor_memory_data_movement
codegen_category: tensor_memory
section: "9.7.17"

instructions:
  - opcode: tcgen05
    section: "9.7.17"
    doc: >-
      Allocate, deallocate, and relinquish Tensor Memory permission; transfer
      registers by load, store, reduction, and matching same-thread waits;
      copy from shared memory, shift Tensor Memory rows, and issue dense and sparse non-WS/WS f16/tf32/i8/f8f6f4 and block-scaled mxf8f6f4/mxf4/mxf4nvf4 MMA.
      Allocation, warp participation, and completion ordering remain runtime obligations.
      Commit tracks prior same-thread TCGEN work through a cluster mbarrier; specialized fences express ordering obligations.
    syntax: >-
      tcgen05.alloc.cta_group::{1|2}.sync.aligned{.shared::cta}.b32 [dst], nCols |
      tcgen05.dealloc.cta_group::{1|2}.sync.aligned.b32 taddr, nCols |
      tcgen05.relinquish_alloc_permit.cta_group::{1|2}.sync.aligned |
      tcgen05.ld.sync.aligned.shape.num{.pack::16b}.b32 {r}, [taddr]{, immHalfSplitoff} |
      tcgen05.st.sync.aligned.shape.num{.unpack::16b}.b32 [taddr]{, immHalfSplitoff}, {r} |
      tcgen05.ld.red.sync.aligned.shape.num.redOp{.abs}{.NaN}.type {r}, redVal, [taddr]{, immHalfSplitoff} |
      tcgen05.wait::{ld|st}.sync.aligned |
      tcgen05.commit.cta_group::{1|2}.mbarrier::arrive::one{.shared::cluster}{.multicast::cluster}.b64 [mbar]{, ctaMask} |
      tcgen05.fence::{before_thread_sync|after_thread_sync} |
      tcgen05.cp.cta_group::{1|2}.shape{.multicast}{.b8x16.src_fmt} [taddr], s-desc |
      tcgen05.shift.cta_group::{1|2}.down [taddr] |
      tcgen05.mma.cta_group::{1|2}.kind::{f16|tf32}{.ashift}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, idesc{, disable-output-lane}, enable-input-d{, scale-input-d} |
      tcgen05.mma.cta_group::{1|2}.kind::i8{.ashift}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, idesc{, disable-output-lane}, enable-input-d |
      tcgen05.mma.cta_group::{1|2}.kind::f8f6f4{.ashift}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, idesc{, disable-output-lane}, enable-input-d |
      tcgen05.mma.cta_group::{1|2}.kind::mxf8f6f4.block_scale{.scale_vec::1X|.block32}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, idesc, [scale-A], [scale-B], enable-input-d
      tcgen05.mma.cta_group::{1|2}.kind::mxf4.block_scale{.scale_vec::2X|.block32}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, idesc, [scale-A], [scale-B], enable-input-d
      tcgen05.mma.cta_group::{1|2}.kind::mxf4nvf4.block_scale{.scale_vec::2X|.scale_vec::4X|.block32|.block16}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, idesc, [scale-A], [scale-B], enable-input-d |
      tcgen05.mma.ws.cta_group::1.kind::f16{.collector::{b0|b1|b2|b3}::{fill|use|lastuse|discard}} [d], a, b, idesc, enable-input-d{, zero-column-desc} |
      tcgen05.mma.ws.cta_group::1.kind::tf32{.collector::{b0|b1|b2|b3}::{fill|use|lastuse|discard}} [d], a, b, idesc, enable-input-d{, zero-column-desc} |
      tcgen05.mma.ws.cta_group::1.kind::f8f6f4{.collector::{b0|b1|b2|b3}::{fill|use|lastuse|discard}} [d], a, b, idesc, enable-input-d{, zero-column-desc} |
      tcgen05.mma.ws.cta_group::1.kind::i8{.collector::{b0|b1|b2|b3}::{fill|use|lastuse|discard}} [d], a, b, idesc, enable-input-d{, zero-column-desc} |
      tcgen05.mma.ws.sp.cta_group::1.kind::f16{.collector::{b0|b1|b2|b3}::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc, enable-input-d{, zero-column-desc} |
      tcgen05.mma.ws.sp.cta_group::1.kind::tf32{.collector::{b0|b1|b2|b3}::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc, enable-input-d{, zero-column-desc} |
      tcgen05.mma.ws.sp.cta_group::1.kind::f8f6f4{.collector::{b0|b1|b2|b3}::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc, enable-input-d{, zero-column-desc} |
      tcgen05.mma.ws.sp.cta_group::1.kind::i8{.collector::{b0|b1|b2|b3}::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc, enable-input-d{, zero-column-desc} |
      tcgen05.mma.sp.cta_group::{1|2}.kind::{f16|tf32}{.ashift}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc{, disable-output-lane}, enable-input-d{, scale-input-d} |
      tcgen05.mma.sp.cta_group::{1|2}.kind::{f8f6f4|i8}{.ashift}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc{, disable-output-lane}, enable-input-d
      tcgen05.mma.sp.cta_group::{1|2}.kind::mxf8f6f4.block_scale{.scale_vec::1X|.block32}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc, [scale-A], [scale-B], enable-input-d |
      tcgen05.mma.sp.cta_group::{1|2}.kind::mxf4.block_scale{.scale_vec::2X|.block32}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc, [scale-A], [scale-B], enable-input-d |
      tcgen05.mma.sp.cta_group::{1|2}.kind::mxf4nvf4.block_scale{.scale_vec::2X|.scale_vec::4X|.block32|.block16}{.collector::a::{fill|use|lastuse|discard}} [d], a, b, [sp-meta], idesc, [scale-A], [scale-B], enable-input-d
