          - {name: sync, kind: flag, presence: fixed, value: true, token: .sync}
          - {name: aligned, kind: flag, presence: fixed, value: true, token: .aligned}
          - {name: shape, kind: tcgen_shape, domain: tcgen_data_shapes, presence: required, values: [{value: s32x32b, token: .32x32b}, {value: s16x64b, token: .16x64b}, {value: s16x128b, token: .16x128b}, {value: s16x256b, token: .16x256b}]}
          - {name: num, kind: tcgen_num, domain: tcgen_repeats, presence: required, values: [x1, x2, x4, x8, x16, x32, x64, x128]}
