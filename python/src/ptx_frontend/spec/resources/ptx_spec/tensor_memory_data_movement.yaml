          - {name: aligned, kind: flag, presence: fixed, value: true, token: .aligned}
          - {name: type, kind: type, domain: scalar_types, presence: fixed, value: b32}
        operands:
          - {name: taddr, kind: tensor_memory_address, role: src, access: read, type: u32}
          - {name: ncols, kind: reg_or_imm, role: src, access: read, type: u32}
      - name: tcgen05_relinquish_alloc_permit
        rule: tensor_memory.relinquish_alloc_permit
        availability: *tcgen_alloc_availability
        operands: []
        modifiers:
