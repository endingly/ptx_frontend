# PTX 9.3 video instructions.
# yaml-language-server: $schema=../ptx-instr-v1.schema.yaml
schema: ptx-instr/v1
ptx_isa: '9.3'
category: video
codegen_category: video
section: 9.7.19
instructions:
- opcode: vadd
  section: 9.7.19.1.1
  doc: Scalar video add with typed selection, saturation, and secondary operation.
  syntax: vadd.dtype.atype.btype{.sat}[.secop] d, a, b[, c];
  variants:
  - name: vadd_scalar
    availability:
      ptx: '2.0'
      sm: 20
    video:
      lanes: scalar
      operation: arithmetic
      sat_modifier: sat
    modifiers:
    - name: dtype
      kind: video_type
      presence: required
      values:
      - s32
      - u32
      domain: video_types
    - name: atype
      kind: video_type
      presence: required
      values:
      - s32
      - u32
      domain: video_types
    - name: btype
      kind: video_type
      presence: required
      values:
      - s32
      - u32
      domain: video_types
    - name: sat
      kind: flag
      presence: optional
      values:
      - value: true
        token: .sat
      default: false
    - name: secondary
      kind: video_secondary_op
      presence: optional
      values:
      - add
      - min
      - max
      domain: video_secondary_ops
      default: none
    operand_layouts:
    - name: plain
      forbidden_modifiers:
      - secondary
      operands:
      - name: dst
        kind: video_operand
        role: dst
        access: write
        video:
          position: destination
          selector: none
          type_modifier: dtype
      - name: a
        kind: video_operand
        role: src
        access: read
        video:
          position: a
          selector: optional_scalar
          type_modifier: atype
          allow_immediate: true
      - name: b
        kind: video_operand
        role: src
        access: read
        video:
          position: b
          selector: optional_scalar
          type_modifier: btype
          allow_immediate: true
    - name: secondary
      operands:
      - name: dst
        kind: video_operand
        role: dst
        access: write
        video:
          position: destination
          selector: none
          type_modifier: dtype
      - name: a
        kind: video_operand
        role: src
        access: read
        video:
          position: a
          selector: optional_scalar
          type_modifier: atype
          allow_immediate: true
      - name: b
        kind: video_operand
        role: src
        access: read
        video:
          position: b
          selector: optional_scalar
          type_modifier: btype
          allow_immediate: true
      - name: c
        kind: video_operand
        role: src
        access: read
        video:
          position: c
          selector: none
          type_modifier: dtype
          allow_immediate: true
    - name: merge
      forbidden_modifiers:
      - secondary
      operands:
      - name: dst
        kind: video_operand
        role: dst
        access: write
        video:
          position: destination
          selector: required_scalar
          type_modifier: dtype
      - name: a
        kind: video_operand
        role: src
        access: read
        video:
          position: a
          selector: optional_scalar
          type_modifier: atype
          allow_immediate: true
      - name: b
        kind: video_operand
        role: src
        access: read
        video:
          position: b
          selector: optional_scalar
          type_modifier: btype
          allow_immediate: true
      - name: c
        kind: video_operand
        role: src
        access: read
        video:
          position: c
          selector: none
          type_modifier: dtype
          allow_immediate: true
