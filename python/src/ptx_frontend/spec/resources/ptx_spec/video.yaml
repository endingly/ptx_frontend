  syntax: vmad.dtype.atype.btype{.po}{.sat}{.scale} d, a, b, c;
  variants:
  - name: vmad_scalar
    availability:
      ptx: '2.0'
      sm: 20
    video:
      lanes: scalar
      operation: mad
      sat_modifier: sat
      po_modifier: po
    modifiers:
    - name: dtype
      kind: video_type
      presence: required
      values:
      - s32
      - u32
      domain: video_types
    - name: atype
      kind: video_type
      presence: required
      values:
      - s32
      - u32
      domain: video_types
    - name: btype
      kind: video_type
      presence: required
      values:
      - s32
      - u32
      domain: video_types
    - name: po
      kind: flag
      presence: optional
      values:
      - value: true
        token: .po
      default: false
    - name: sat
      kind: flag
      presence: optional
      values:
      - value: true
        token: .sat
      default: false
    - name: scale
      kind: video_scale
      presence: optional
      values:
      - shr7
      - shr15
      domain: video_scales
      default: none
    operand_layouts:
    - name: mad
      operands:
      - name: dst
        kind: video_operand
        role: dst
        access: write
        video:
          position: destination
          selector: none
          type_modifier: dtype
      - name: a
        kind: video_operand
        role: src
        access: read
        video:
          position: a
          selector: optional_scalar
          type_modifier: atype
          allow_immediate: true
          allow_negate: true
      - name: b
        kind: video_operand
        role: src
        access: read
        video:
          position: b
          selector: optional_scalar
          type_modifier: btype
          allow_immediate: true
          allow_negate: true
      - name: c
        kind: video_operand
        role: src
        access: read
        video:
          position: c
          selector: none
          allow_immediate: true
          allow_negate: true
          type_use: bit_carrier
