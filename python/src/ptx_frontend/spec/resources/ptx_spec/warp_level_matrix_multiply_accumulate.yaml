- opcode: mma
  section: 9.7.15.5.14
  doc: Matrix multiply-accumulate, limited to m16n8k8 f16 inputs and f32 accumulation.
  syntax: mma.sync.aligned.m16n8k8.row.col.f32.f16.f16.f32 {dst0, dst1, dst2, dst3}, {a0, a1}, {b0}, {c0, c1,
    c2, c3}
  operands: $mma_m16n8k8_f32_f16
  variants:
  - name: mma_sync_aligned_m16n8k8_row_col_f32_f16_f16_f32
    availability:
      ptx: '6.5'
      sm: 75
    matrix:
      family: mma
      m: 16
      n: 8
      k: 8
      a_layout: row
      b_layout: col
      elements:
        d: f32
        a: f16
        b: f16
        c: f32
      fragments:
        dst: d
        a: a
        b: b
        c: c
    modifiers:
    - name: sync
      kind: flag
      presence: fixed
      value: true
      token: .sync
    - name: aligned
      kind: flag
      presence: fixed
      value: true
      token: .aligned
    - name: m16n8k8
      kind: flag
      presence: fixed
      value: true
      token: .m16n8k8
    - name: row
      kind: flag
      presence: fixed
      value: true
      token: .row
    - name: col
      kind: flag
      presence: fixed
      value: true
      token: .col
    - name: d_type
      kind: type
      domain: scalar_types
      presence: fixed
      value: f32
    - name: a_type
      kind: type
      domain: scalar_types
      presence: fixed
      value: f16
    - name: b_type
      kind: type
      domain: scalar_types
      presence: fixed
      value: f16
    - name: c_type
      kind: type
      domain: scalar_types
      presence: fixed
      value: f32
    rule: matrix.mma
    examples:
    - ptx: mma.sync.aligned.m16n8k8.row.col.f32.f16.f16.f32 {%d0, %d1, %d2, %d3}, {%a0, %a1}, {%b0}, {%c0,
        %c1, %c2, %c3};
      valid: true
