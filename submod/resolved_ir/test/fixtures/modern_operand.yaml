schema: ptx-instr/v1
ptx_isa: "9.3"
category: test
codegen_category: test

instructions:
  - opcode: synthetic_sm90a
    variants:
      - name: synthetic_sm90a_exact
        availability: {any_of: [{ptx: "8.0", sm: 90, target: sm_90a}]}
        operands: []

  - opcode: synthetic_sm100a
    variants:
      - name: synthetic_sm100a_exact
        availability: {any_of: [{ptx: "8.0", sm: 100, target: sm_100a}]}
        operands: []

  - opcode: synthetic_sm100f_feature
    variants:
      - name: synthetic_sm100f_feature_default
        availability: {ptx: "8.8", sm: 100, family: sm_100f}
        operands: []

  - opcode: synthetic_sm103f_feature
    variants:
      - name: synthetic_sm103f_feature_default
        availability: {ptx: "9.3", sm: 103, family: sm_103f}
        operands: []

  - opcode: synthetic_modern
    variants:
      - name: synthetic_modern_primitive
        availability: {ptx: "9.3", sm: 0}
        operands:
          - name: coordinate
            kind: tensor_coordinate
            role: src
            access: read
            type: u32
            cardinality: {min: 1, max: 5}
            element_kinds: [reg, imm]
          - name: fragment
            kind: matrix_fragment
            role: src
            access: read
            type: u32
            cardinality: {min: 1, max: 64}
            element_kinds: [reg]

  - opcode: synthetic_immediate_layout
    variants:
      - name: synthetic_immediate_layout_range
        availability: {ptx: "9.3", sm: 0}
        operand_layouts:
          - name: count_only
            operands:
              - name: count
                kind: imm
                role: src
                access: read
                type: u32
          - name: dst_count
            operands:
              - name: dst
                kind: reg
                role: dst
                access: write
              - name: count
                kind: imm
                role: src
                access: read
                type: u32
        constraints:
          - kind: immediate_range
            operand: count
            minimum: 0
            maximum: 7

  - opcode: synthetic_uint64_immediate
    variants:
      - name: synthetic_uint64_immediate_bounds
        availability: {ptx: "9.3", sm: 0}
        operands:
          - name: count
            kind: imm
            role: src
            access: read
            type: u64
        constraints:
          - kind: immediate_value
            operand: count
            values: [9223372036854775808, 18446744073709551615]
          - kind: immediate_range
            operand: count
            minimum: 9223372036854775808
            maximum: 18446744073709551615
          - kind: immediate_multiple_of
            operand: count
            divisor: 18446744073709551615
